<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Desk">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>/* Layout: a flat, friendly learning app. White (or Duolingo-style slate in dark mode), outlined cards with a thick bottom edge, one chunky rounded font, simple colored icons, icon-only tab bar. No gradients, no glows, no small caps. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F7F7F7; --line:#E5E5E5; --ink:#4B4B4B; --head:#3C3C3C; --muted:#777777; --dim:#AFAFAF;
  --sel-bg:#DDF4FF; --sel-line:#84D8FF; --sel-ink:#1CB0F6;
  --good-bg:#D7FFB8; --good-ink:#58A700; --bad-bg:#FFDFE0; --bad-ink:#EA2B2B;
  --green:#58CC02; --green-lip:#58A700;
  --blue:#1CB0F6; --blue-lip:#1899D6;
  --orange:#FF9600; --orange-lip:#E08200;
  --purple:#CE82FF; --purple-lip:#A568CC;
  --red:#FF4B4B; --red-lip:#EA2B2B;
  --yellow:#FFC800; --yellow-lip:#E0A800;
  --c:var(--blue); --c-lip:var(--blue-lip);
  --f-ui:"Nunito","DIN Round Pro",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:var(--f-ui);
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans CJK JP",sans-serif;
  --f-hand:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;
  --f-flag:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131F24; --card:#131F24; --soft:#202F36; --line:#37464F; --ink:#F1F7FB; --head:#F1F7FB; --muted:#9FB2BC; --dim:#52656D;
  --sel-bg:#1C3644; --sel-line:#3F85A7; --sel-ink:#49C0F8;
  --good-bg:#202F36; --good-ink:#79D634; --bad-bg:#202F36; --bad-ink:#FF7878; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131F24; --card:#131F24; --soft:#202F36; --line:#37464F; --ink:#F1F7FB; --head:#F1F7FB; --muted:#9FB2BC; --dim:#52656D;
  --sel-bg:#1C3644; --sel-line:#3F85A7; --sel-ink:#49C0F8;
  --good-bg:#202F36; --good-ink:#79D634; --bad-bg:#202F36; --bad-ink:#FF7878; color-scheme:dark}
@font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format("woff2")}
.t-world{--c:var(--blue);--c-lip:var(--blue-lip)}
.t-mind{--c:var(--orange);--c-lip:var(--orange-lip)}
.t-words{--c:var(--purple);--c-lip:var(--purple-lip)}
.t-jp{--c:var(--red);--c-lip:var(--red-lip)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 17px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none;font-variant-numeric:tabular-nums}
body.has-layer{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;line-height:1.2;color:var(--head);text-wrap:balance}
p{margin:0}
[lang="ja"]{font-family:var(--f-jp)}
.glow{display:none}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(var(--st) + 20px) 16px calc(var(--sb) + 100px)}
.view{display:grid;gap:16px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.vhead h1{font-size:1.75rem}
.vhead .eyebrow{font-size:.95rem;font-weight:700;color:var(--muted)}
.vhead p.sub{display:none}
.h2{font-size:1.3rem;font-weight:800;color:var(--head);margin:4px 0 -10px}
.eyebrow{font-size:.95rem;font-weight:800;color:var(--muted)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--sb) + 8px);background:var(--bg);border-top:2px solid var(--line)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{background:none;border:2px solid transparent;display:grid;place-items:center;height:52px;border-radius:14px;padding:0}
.tab svg{width:34px;height:34px}
.tab>span:not(.ti){display:none}
.tab[aria-selected="true"]{background:var(--sel-bg);border-color:var(--sel-line)}

.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);display:grid;place-items:center;color:var(--dim);flex:none}
.iconbtn:active{border-bottom-width:2px;transform:translateY(2px)}
.iconbtn svg{width:24px;height:24px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 18px;min-height:50px;background:var(--card);color:var(--sel-ink);font-weight:800;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.c,.btn.good{background:var(--green);border-color:var(--green-lip);color:#fff}
.btn.bad{background:var(--red);border-color:var(--red-lip);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.8rem;border-radius:12px}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--dim);cursor:default}
.link{background:none;border:0;padding:0;color:var(--sel-ink);font-weight:800}

/* ---------- icons ---------- */
.bi{position:relative;display:grid;place-items:center;width:var(--s,60px);height:var(--s,60px);border-radius:50%;background:var(--c);box-shadow:0 4px 0 var(--c-lip);color:#fff;flex:none}
.bi svg{width:58%;height:58%}
.bi.flagbi{background:var(--soft);box-shadow:0 4px 0 var(--line);font:400 calc(var(--s,60px)*.55)/1 var(--f-flag)}
.bi.txt{font:900 calc(var(--s,60px)*.42)/1 var(--f-ui)}
.bi.ja{font:600 calc(var(--s,60px)*.46)/1 var(--f-jp)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:grid;justify-items:center;align-content:start;gap:10px;padding:18px 12px 16px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;text-align:center;color:var(--ink);min-width:0}
.tile:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tile.wide{grid-column:1/-1;grid-template-columns:auto 1fr;justify-items:start;text-align:left;align-items:center;gap:16px;padding:16px}
.tile b{display:block;font-size:1.02rem;font-weight:800;color:var(--head);line-height:1.2;margin-top:2px}
.tile .d{display:block;color:var(--muted);font-size:.86rem;font-weight:700;line-height:1.3;margin-top:2px}
.tile .meta{display:inline-block;margin-top:6px;font-size:.8rem;font-weight:800;color:var(--sel-ink)}
.tile .flags{font:400 2.1rem/1 var(--f-flag);letter-spacing:.06em}

.rows{display:grid;gap:12px}
.rowcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px 12px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;text-align:left;color:var(--ink);min-width:0}
.rowcard:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.rowcard b{display:block;font-weight:800;color:var(--head);line-height:1.2}
.rowcard .d{display:block;color:var(--muted);font-size:.9rem;font-weight:700;line-height:1.3;margin-top:2px}
svg.chev{width:22px;height:22px;flex:none;color:var(--dim)}
.rowcard .chev{color:var(--dim);width:22px;height:22px}
.dq{text-align:left}
.view svg:not([width]):not([class]){max-width:100%}
.rowcard.done{background:var(--soft)}
.rowcard.done .chev{color:var(--green)}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;min-width:0}
.card .eyebrow{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.wotd .w{font:900 1.8rem/1.1 var(--f-ui);color:var(--head)}
.callout{padding:14px 16px;border-radius:16px;background:var(--sel-bg);border:2px solid var(--sel-line);font-size:.95rem;color:var(--ink)}

/* ---------- Japanese path ---------- */
.jtools{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.jtools::-webkit-scrollbar{display:none}
.mini{flex:none;width:104px;display:grid;justify-items:center;gap:8px;padding:14px 8px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;text-align:center;color:var(--ink)}
.mini:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.mini b{font-size:.84rem;font-weight:800;line-height:1.15;color:var(--head)}
.banner{border-radius:16px;padding:16px 18px;background:var(--c);color:#fff;border-bottom:4px solid var(--c-lip);display:grid;gap:2px}
.banner small{font-size:.9rem;font-weight:800;opacity:.85}
.banner b{font-size:1.3rem;font-weight:900}
.banner span{font-weight:700;opacity:.92;font-size:.95rem}
.path{display:grid;justify-items:center;gap:10px;padding:26px 0 8px}
.node{position:relative;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink)}
.node .disc{width:72px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--line);box-shadow:0 7px 0 color-mix(in srgb,var(--line) 70%,#000);font:600 1.8rem var(--f-jp);color:var(--dim);transition:transform .06s,box-shadow .06s}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--line) 70%,#000)}
.node.done .disc,.node.next .disc{background:var(--c);color:#fff;box-shadow:0 7px 0 var(--c-lip)}
.node.done:active .disc,.node.next:active .disc{box-shadow:0 2px 0 var(--c-lip)}
.node.next .disc{outline:6px solid var(--line);outline-offset:5px}
.node .disc svg{width:34px;height:34px}
.node .lbl{font-size:.8rem;font-weight:800;color:var(--muted);max-width:120px;text-align:center;line-height:1.2;margin-top:10px}
.node.next .lbl{color:var(--head)}
.bubble{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--c);border:2px solid var(--line);font-size:.9rem;font-weight:900;letter-spacing:.04em;padding:8px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.spacer{height:18px}

/* ---------- layers ---------- */
#layers{position:relative;z-index:40}
.layer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);will-change:transform}
.layer.in{transform:none}
.layer.out{transform:translateX(100%)}
.layer.up{transform:translateY(100%)}
.layer.up.in{transform:none}
.layer.up.out{transform:translateY(100%)}
.lhead{position:relative;display:flex;align-items:center;gap:14px;padding:calc(var(--st) + 10px) 16px 10px;max-width:640px;width:100%;margin:0 auto}
.lhead .iconbtn{border:0;background:none;width:40px}
.lhead .ltitle{font-weight:800;font-size:1.1rem;color:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:9px;background:var(--green);position:relative;transition:width .35s cubic-bezier(.3,.9,.3,1);min-width:16px}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.lbody{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lin{max-width:640px;margin:0 auto;padding:8px 16px 28px;display:grid;gap:20px;align-content:start;min-height:100%}
.lfoot{position:relative;padding:14px 16px calc(var(--sb) + 16px);border-top:2px solid var(--line);background:var(--bg)}
.lfoot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.lfoot .in>*{flex:1}

.hero{display:grid;gap:10px;justify-items:start;padding-top:4px}
.hero .bi{--s:76px;margin-bottom:6px}
.hero h2{font-size:1.6rem}
.hero p{color:var(--muted);font-weight:700}
.field{display:grid;gap:10px}
.flabel{font-size:1rem;font-weight:800;color:var(--head)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:9px 14px;font-weight:800;font-size:.95rem;color:var(--ink)}
.seg button:active{border-bottom-width:2px;transform:translateY(2px)}
.seg button[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-ink)}

/* question */
.prompt{font-size:1.5rem;font-weight:800;color:var(--head);line-height:1.2}
.qcard{min-height:min(32vh,240px);display:grid;place-items:center;text-align:center;padding:18px;border-radius:18px;border:2px solid var(--line)}
.qcard .flag{font:400 clamp(110px,32vw,160px)/1 var(--f-flag)}
.qcard .bigtxt{font:900 clamp(1.7rem,7.5vw,2.4rem)/1.15 var(--f-ui);color:var(--head);overflow-wrap:anywhere}
.qcard .bigdef{font-size:1.15rem;font-weight:700;line-height:1.45;max-width:40ch;color:var(--ink)}
.qcard .kana{font:600 clamp(80px,26vw,118px)/1.1 var(--f-hand);color:var(--head)}
.qcard .jp-ruby{font-size:clamp(2rem,9vw,2.7rem)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
@media (max-width:400px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;text-align:left;font-weight:700;font-size:1.05rem;color:var(--ink);min-width:0}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.opt kbd{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:800 .85rem var(--f-ui);color:var(--dim)}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt .kana-opt{font:600 1.8rem var(--f-hand)}
.opt.right{border-color:var(--green);background:var(--good-bg);color:var(--good-ink)}
.opt.right kbd{border-color:var(--green);color:var(--good-ink)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);color:var(--bad-ink)}
.opt.wrong kbd{border-color:var(--red);color:var(--bad-ink)}
.opt:disabled{cursor:default}
.answer-in{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--soft);padding:16px 18px;font-size:1.2rem;font-weight:700}
.answer-in:focus{outline:none;border-color:var(--sel-line)}
.tline{min-height:70px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-content:center}
.tbank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tl{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:6px 14px;font:600 1.6rem/1.3 var(--f-hand);color:var(--head)}
.tl:active{transform:translateY(2px);border-bottom-width:2px}
.tl:disabled{background:var(--line);color:transparent;border-color:var(--line);transform:none}

/* feedback sheet */
.fb{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:20px 16px calc(var(--sb) + 16px);transform:translateY(105%);transition:transform .2s cubic-bezier(.2,.8,.2,1);max-height:75%;overflow-y:auto}
.fb.show{transform:none}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb .in{max-width:640px;margin:0 auto;display:grid;gap:12px}
.fb .top{display:flex;gap:12px;align-items:center}
.fb .badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--good-bg);background:var(--good-ink)}
.fb.bad .badge{background:var(--bad-ink);color:var(--bad-bg)}
.fb .badge svg{width:22px;height:22px}
.fb h3{font-size:1.4rem;font-weight:900}
.fb.good h3,.fb.good .ans,.fb.good .ex{color:var(--good-ink)}
.fb.bad h3,.fb.bad .ans,.fb.bad .ex{color:var(--bad-ink)}
.fb .ans{font-weight:800;font-size:1.1rem}
.fb .ex{font-weight:700;font-size:.98rem}
.fb .row{display:flex;gap:10px;align-items:center;margin-top:4px}
.fb .row .btn.block{flex:1}
.fb .btn.sm{background:transparent}

/* summary */
.sum{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:5vh}
.sum .big{font:900 4.2rem/1 var(--f-ui);color:var(--green)}
.sum .of{color:var(--muted);font-weight:800;font-size:1.05rem}
.misslist{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;text-align:left}
.misslist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);flex-wrap:wrap}
.misslist .fl{font:400 1.6rem/1 var(--f-flag)}

/* math */
.mrun{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:2vh}
.mmeta{display:flex;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:.95rem;color:var(--muted)}
.problem{font:900 clamp(3rem,15vw,4.6rem)/1.05 var(--f-ui);color:var(--head);letter-spacing:-.01em}
.mans{min-width:min(100%,220px);min-height:72px;padding:6px 18px;border-radius:18px;border:2px solid var(--line);background:var(--soft);font:900 2.4rem/56px var(--f-ui);color:var(--sel-ink)}
.mans.flash{border-color:var(--red);background:var(--bad-bg);color:var(--bad-ink)}
.mrev{min-height:1.5em;color:var(--bad-ink);font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}
.key{min-height:60px;border-radius:16px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;font:800 1.6rem var(--f-ui);color:var(--head)}
.key:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.key.fn{font:800 .85rem var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--sel-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{padding:14px 8px;border-radius:16px;border:2px solid var(--line)}
.stat b{display:block;font:900 1.6rem var(--f-ui);color:var(--c)}
.stat span{font-size:.85rem;font-weight:800;color:var(--muted)}
.trick{display:grid;gap:6px;padding:16px;border-radius:16px;border:2px solid var(--line)}
.trick b{font-size:1.05rem;font-weight:900;color:var(--head)}
.trick code{font:800 1rem var(--f-ui);background:var(--soft);padding:6px 10px;border-radius:10px;justify-self:start;overflow-wrap:anywhere;color:var(--c)}

/* lists */
.search{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--soft);padding:12px 16px;font-size:16px;font-weight:700}
.search:focus{outline:none;border-color:var(--sel-line)}
.list{display:grid;border-radius:18px;border:2px solid var(--line);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:2px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .fl{font:400 2rem/1 var(--f-flag)}
.li .num{font-weight:900;font-size:.95rem;color:var(--c);white-space:nowrap}
.li b{font-weight:800;display:block;color:var(--head)}
.li .s{color:var(--muted);font-size:.9rem;font-weight:700;display:block;line-height:1.35}
.li .r{color:var(--dim);font-size:.84rem;font-weight:800;text-align:right}
.li.nb{grid-template-columns:1fr auto}

/* text + AI screens */
textarea.ta,input.ti{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--soft);padding:14px 16px;font-size:17px;font-weight:700;line-height:1.45}
textarea.ta{min-height:120px;resize:none}
textarea.ta:focus,input.ti:focus{outline:none;border-color:var(--sel-line)}
.status{font-weight:700;color:var(--muted);font-size:.95rem;min-height:1.4em}
.status.err{color:var(--bad-ink)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}
.btn:disabled .spin{border-color:var(--dim);border-top-color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.out{display:grid;gap:14px}
.ver{display:grid;gap:6px;padding:16px;border-radius:16px;border:2px solid var(--line)}
.ver .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ver .flabel{font-size:.9rem;color:var(--c)!important}
.ver p{font-size:1.08rem;font-weight:700;color:var(--head)}
.wrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:2px solid var(--line);align-items:start}
.wrow .w{font-size:1.2rem;font-weight:900;color:var(--c)}
.wrow .from{color:var(--muted);font-size:.88rem;font-weight:700}
.wrow .ex{grid-column:1/-1;color:var(--muted);font-style:italic;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.86rem;font-weight:800;border:2px solid var(--line);border-radius:999px;padding:3px 12px}
.note{border-left:4px solid var(--c);padding:4px 0 4px 12px;font-weight:700}
.empty{color:var(--muted);padding:18px;border-radius:16px;border:2px dashed var(--line);text-align:center;font-weight:700}

/* Japanese text */
ruby{ruby-position:over;ruby-align:center}
rt{font:800 max(11px,.36em)/1 var(--f-ui);color:var(--red);letter-spacing:0;padding-bottom:3px}
rt.furi{font:700 max(10px,.42em)/1 var(--f-jp);color:var(--muted)}
body.no-rt rt:not(.furi){visibility:hidden}
.jp-ruby{font:600 clamp(1.8rem,7.5vw,2.5rem)/2.25 var(--f-hand);color:var(--head);overflow-wrap:anywhere}
.jp-ruby .chunk{display:inline-block;margin-right:.3em}
.jp-big{font:600 clamp(1.5rem,6vw,2rem)/2 var(--f-hand);color:var(--head);overflow-wrap:anywhere}
.jp-romaji{font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.jp-hand{font-family:var(--f-hand);font-weight:600}
.bd-wrap{display:flex;flex-wrap:wrap;gap:8px}
.bd{border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:1px;min-width:0}
.bd .j{font:600 1.25rem var(--f-hand);color:var(--head)}
.bd .r{font-weight:700;font-size:.8rem;color:var(--muted)}
.bd .m{font-size:.86rem;font-weight:700}
.say{width:46px;height:46px;border-radius:14px;border:0;border-bottom:4px solid var(--blue-lip);background:var(--blue);color:#fff;display:none;place-items:center;flex:none}
.say svg{width:24px;height:24px}
.say:active{transform:translateY(2px);border-bottom-width:2px}
body.can-say .say{display:grid}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kc{border:2px solid var(--line);border-radius:14px;text-align:center;padding:4px 2px 8px}
.kc .k{font:600 1.8rem/1.9 var(--f-hand);display:block;color:var(--head)}
.kc .r{font:800 .8rem var(--f-ui);color:var(--red)}
.kc.blank{border:0}
.intro-cells{display:flex;flex-wrap:wrap;gap:10px}
.intro-cells .ic{min-width:68px;padding:4px 12px 8px;border-radius:16px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;text-align:center;font:600 2.4rem/2.2 var(--f-hand);color:var(--head)}
.iw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.iw .jp{font:600 1.6rem/2.1 var(--f-hand);flex:1;min-width:0;color:var(--head)}
.iw .en{font-weight:800;color:var(--muted);text-align:right}
.fcard{display:grid;gap:16px;justify-items:center;text-align:center;padding:26px 18px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;min-height:40vh;align-content:center}
.fcard .front{font-size:1.5rem;font-weight:900;color:var(--head)}

/* settings */
.set{display:grid;gap:14px;padding:18px;border-radius:18px;border:2px solid var(--line)}
.set h3{font-size:1.15rem}
.set ol{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--muted);font-weight:700}
.set ol b{color:var(--head)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;color:var(--head)}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:.2s;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:24px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0}
.ok{color:var(--good-ink)}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--head);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:14px;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- dashboard ---------- */
.t-fact{--c:var(--yellow);--c-lip:var(--yellow-lip)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.95rem}
.dq{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card)}
.dq b{display:block;font-size:1.15rem;font-weight:900;color:var(--head)}
.dq .d{display:block;color:var(--muted);font-size:.9rem;font-weight:700;line-height:1.3;margin-top:2px}
.dq .btn{min-height:44px;padding:8px 16px}
.dash{gap:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dhead .seg button{padding:6px 11px;font-size:.85rem;border-bottom-width:3px;border-radius:12px}
.dash .stats{gap:8px}
.dash .stat{padding:12px 6px;text-align:center}
.dash .stat b{font-size:1.7rem;color:var(--head)}
.dash .stat:first-child b{color:var(--green)}
.chart{display:flex;align-items:stretch;gap:4px;height:140px}
.chart.month{gap:2px}
.chart .col{flex:1;display:grid;grid-template-rows:1fr auto;gap:6px;min-width:0}
.chart .bar-wrap{display:flex;align-items:flex-end;border-radius:8px;background:var(--soft)}
.chart .bar{width:100%;background:var(--blue);border-radius:8px;position:relative;min-height:0;transition:height .4s}
.chart.month .bar,.chart.month .bar-wrap{border-radius:4px}
.chart .now .bar{background:var(--green)}
.chart .fut .bar-wrap{opacity:.45}
.chart .bar span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:.75rem;font-weight:900;color:var(--muted)}
.chart .cl{font-size:.75rem;font-weight:800;color:var(--dim);text-align:center;height:1em;line-height:1}
.chart .now .cl{color:var(--head)}
.bookrow b{font-size:1.1rem}
.subj{display:grid;gap:4px}
.srow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 0;background:none;border:0;text-align:left;color:var(--ink)}
.srow .st{display:grid;gap:6px;min-width:0}
.srow .top{display:flex;justify-content:space-between;gap:8px}
.srow b{font-weight:800;color:var(--head)}
.srow .cnt{font-weight:800;color:var(--muted);font-size:.9rem;white-space:nowrap}
.pb{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;border-radius:6px;background:var(--c);min-width:0}
.factc .fact{font-size:1.1rem;font-weight:700;color:var(--head);line-height:1.45}
.factcard{display:grid;gap:18px;justify-items:start;padding:24px 20px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;min-height:44vh;align-content:center}
.factcard .fact{font-size:1.4rem;font-weight:800;color:var(--head);line-height:1.4}
.factcard .tag{color:var(--yellow-lip);border-color:var(--yellow)}
.dayhead{font-weight:900;color:var(--head);font-size:1.05rem;margin:4px 2px -10px}
.li.kb{grid-template-columns:auto 1fr auto;align-items:start}
.li.kb .r{padding-top:3px}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:none}
.gbtn{color:var(--head);gap:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-weight:800}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes burst{0%{transform:rotate(var(--a)) translateY(0) scale(.4);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(1);opacity:0}}
@keyframes bigIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--c-lip),0 0 0 0 color-mix(in srgb,var(--c) 40%,transparent)}50%{box-shadow:0 7px 0 var(--c-lip),0 0 0 12px color-mix(in srgb,var(--c) 0%,transparent)}}
.view>*{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.03s}.view>*:nth-child(3){animation-delay:.06s}.view>*:nth-child(4){animation-delay:.09s}.view>*:nth-child(5){animation-delay:.12s}.view>*:nth-child(n+6){animation-delay:.15s}
.tiles>.tile{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
.tiles>.tile:nth-child(2){animation-delay:.04s}.tiles>.tile:nth-child(3){animation-delay:.08s}.tiles>.tile:nth-child(4){animation-delay:.12s}.tiles>.tile:nth-child(n+5){animation-delay:.16s}
.lin>*{animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
.opt.right{animation:popIn .32s ease}
.opt.wrong{animation:shake .38s ease}
.fb{transition:transform .32s cubic-bezier(.2,1.25,.4,1)}
.pbar i{overflow:hidden}
.pbar i::before{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.4s ease-in-out infinite}
.node.next .disc{animation:pulse 1.8s ease-in-out infinite}
.sum{position:relative}
.sum .big{animation:bigIn .55s cubic-bezier(.2,1.3,.4,1) both}
.burst{position:absolute;left:50%;top:calc(5vh + 34px);width:0;height:0}
.burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:3px;background:var(--h);animation:burst .9s cubic-bezier(.2,.8,.3,1) both}
.pop{animation:popIn .3s ease}
.chart .bar{animation:grow .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.btn.big{min-height:58px;font-size:1.05rem}

/* ---------- worked steps ---------- */
.work{display:grid;gap:4px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--card) 70%,transparent);border:2px solid color-mix(in srgb,currentColor 25%,transparent);font-weight:700;font-size:.95rem;color:var(--head)}
.work span{font-size:.8rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.work div{padding-left:4px;border-left:3px solid color-mix(in srgb,currentColor 25%,transparent);padding-left:10px}

/* ---------- map ---------- */
.mapwrap{border:2px solid var(--line);border-radius:18px;padding:8px;background:var(--soft);overflow:hidden}
.usmap{width:100%;height:auto;display:block}
.usmap .st{fill:var(--card);stroke:var(--line);stroke-width:1.2;transition:fill .15s;cursor:pointer}
.usmap.learn .st:hover,.usmap.tap .st:hover{fill:var(--sel-bg)}
.usmap .st.hi{fill:var(--blue);stroke:var(--blue-lip)}
.usmap .st.right{fill:var(--green);stroke:var(--green-lip)}
.usmap .st.wrong{fill:var(--red);stroke:var(--red-lip)}
.usmap.q{max-width:100%;width:100%}
.qcard .usmap{width:100%}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{display:grid;gap:2px}
.facts span{font-size:.8rem;font-weight:800;color:var(--muted)}
.facts b{color:var(--head)}

/* ---------- reference ---------- */
.letters{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.letters button{border:2px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:10px;padding:6px 0;font-weight:900;color:var(--ink)}
.letters button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}
.li.term{background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit;grid-template-columns:1fr auto;cursor:pointer}
.li.term:first-child{border-top:0}
.li.term .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dumbhero{display:grid;gap:10px;justify-items:center;text-align:center;padding:10px 0}
.dumbface{font:400 72px/1 var(--f-flag);animation:popIn .6s ease}
.dumbhero h2{font-size:1.8rem}
.dumbhero p{color:var(--ink);font-weight:700;max-width:36ch}
.dumbcard .bi{font-size:2rem}

/* ---------- tutor chat ---------- */
.chat{gap:14px}
.msg{max-width:92%;padding:12px 16px;border-radius:18px;line-height:1.5;font-weight:700;display:grid;gap:8px;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.me .tag{color:#fff;border-color:rgba(255,255,255,.5)}
.msg.bot{justify-self:start;border:2px solid var(--line);border-bottom-left-radius:6px;color:var(--head);font-weight:600}
.msg.bot p{margin:0}
.msg.bot .mh{font-weight:900;font-size:1.05rem}
.msg.bot ol,.msg.bot ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.msg.bot b{font-weight:900}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.comp{padding-top:10px}
.comp .ta{font-size:16px}
.camb{cursor:pointer;color:var(--blue)}
.pv{display:flex;align-items:center;gap:12px}
.pv img{height:64px;border-radius:12px;border:2px solid var(--line)}
.starter b{font-size:1rem}

/* ---------- human body ---------- */
.bodywrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:2px solid var(--line);border-radius:18px;padding:10px 6px;background:var(--soft)}
.bodywrap.one{grid-template-columns:1fr;max-width:300px;justify-self:center;width:100%}
.bodysvg{width:100%;height:auto;display:block;max-height:60vh}
.bodysvg .sil>*{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.bodysvg .part>*{fill:color-mix(in srgb,var(--pc) 32%,var(--card));stroke:color-mix(in srgb,var(--pc) 70%,var(--card));stroke-width:1;cursor:pointer;transition:fill .15s}
.bodysvg .part .ring{fill:none!important;stroke-width:7}
.bodysvg .part:hover>*{fill:color-mix(in srgb,var(--pc) 55%,var(--card))}
.bodysvg .part.hi>*{fill:var(--blue);stroke:var(--blue-lip)}
.bodysvg .part.hi .ring{stroke:var(--blue)}
.bodysvg .part.dim>*{opacity:.35}
.bodysvg .part.right>*{fill:var(--green);stroke:var(--green-lip)}
.bodysvg .part.right .ring{stroke:var(--green)}
.bodysvg .part.wrong>*{fill:var(--red);stroke:var(--red-lip)}
.bodysvg .vlab{font:800 11px var(--f-ui);fill:var(--muted)}
.qcard .bodysvg{max-height:38vh;width:auto}
.follow{display:flex;flex-wrap:wrap;gap:8px;justify-self:start;max-width:100%}
.follow button{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.88rem;color:var(--sel-ink)}
.follow button:active{transform:translateY(2px);border-bottom-width:2px}
.introcard{display:grid;justify-items:center;gap:8px;text-align:center;padding:24px 18px;border:2px solid var(--line);border-bottom-width:4px;border-radius:20px}
.introcard .kbig{font:600 clamp(96px,30vw,140px)/1.05 var(--f-hand);color:var(--head)}
.introcard .ksound{font:900 2rem var(--f-ui);color:var(--red)}
.introcard p{font-weight:700;color:var(--ink);max-width:34ch}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs>div{display:grid;gap:10px;align-content:start}
.pr{min-height:64px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--card);font-weight:800;font-size:1.05rem;color:var(--head);padding:6px 8px}
.pr.on{border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-ink)}
.pr.ok{border-color:var(--green);background:var(--good-bg);color:var(--good-ink);opacity:.55;animation:popIn .3s ease}
.pr.no{border-color:var(--red);background:var(--bad-bg);animation:shake .35s ease}
.romhint{display:inline-block;margin-top:8px;font:800 1.15rem var(--f-ui);color:var(--red);letter-spacing:.04em}
.node.wordsnode .disc{font-size:1.5rem}

/* no sideways dragging anywhere (stops the browser's swipe-back arrow) */
html,body{overflow-x:clip;overscroll-behavior-x:none;max-width:100%}
#app,.view,.lin{max-width:100%}
.layer{overflow:hidden;overscroll-behavior:none}
.lbody{overflow-x:hidden;overscroll-behavior-x:none}
.jtools,.seg.scroll{overscroll-behavior-x:contain}

/* ---------- structure: hero, feature pairs, sections, grids ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 -4px;flex-wrap:wrap}
.sec h2{font-size:1.35rem;font-weight:900}
.sec .cnt{font-size:.9rem;font-weight:800;color:var(--muted)}
.sec .seg button{padding:6px 11px;font-size:.85rem;border-bottom-width:3px;border-radius:12px}
.fill{background:var(--c);border:0;box-shadow:0 5px 0 var(--c-lip);color:#fff;border-radius:20px;text-align:left;margin-bottom:5px}
.fill:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c-lip)}
.fill.t-fact{color:#4A3600}
.herocard{display:grid;gap:14px;padding:18px;width:100%}
.hc-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hc-eye{display:block;font-size:.82rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hc-title{display:block;font-size:1.55rem;font-weight:900;line-height:1.15;margin-top:2px}
.hc-sub{display:block;font-weight:800;opacity:.9;margin-top:2px}
.hc-glyph{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font:600 2.2rem/1 var(--f-jp)}
.hc-bar{height:12px;border-radius:99px;background:rgba(0,0,0,.18);overflow:hidden}
.hc-bar i{display:block;height:100%;border-radius:99px;background:#fff}
.wbtn{background:#fff;border-color:rgba(0,0,0,.14);color:var(--c-lip)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.fcard{display:grid;align-content:space-between;gap:12px;padding:16px;min-height:168px;min-width:0}
.fcard .bi{justify-self:start;background:#fff;color:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.fcard b{display:block;font-size:1.08rem;font-weight:900;line-height:1.2}

const KBASE={};'あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ゔvu'.split(' ').forEach(p=>KBASE[p[0]]=p.slice(1));
const SMALLY={'ゃ':'a','ゅ':'u','ょ':'o'},SMALLV={'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'};
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function moras(text){
  const out=[],ch=[...String(text||'')];let pend='';
  for(let i=0;i<ch.length;i++){
    const c=ch[i],h=toHira(c);
    if(h==='っ'){pend+=c;continue}
    if(c==='ー'){const p=out[out.length-1];if(p&&p.r){p.t+=c;p.r+=p.r.slice(-1)}else out.push({t:c,r:''});continue}
    let r=KBASE[h],t=c;
    if(r!==undefined){
      const nx=ch[i+1]&&toHira(ch[i+1]);
      if(nx&&SMALLY[nx]){t+=ch[++i];r=(['shi','chi','ji'].includes(r)?r.slice(0,-1):r.slice(0,-1)+'y')+SMALLY[nx]}
      else if(nx&&SMALLV[nx]){t+=ch[++i];r=r.slice(0,-1)+SMALLV[nx]}
      if(pend){t=pend+t;r=(r.startsWith('ch')?'t':r[0])+r;pend=''}
      out.push({t,r});
    }else{if(pend){out.push({t:pend,r:''});pend=''}out.push({t:c,r:''})}
  }
  if(pend)out.push({t:pend,r:''});
  return out;
}
const PARTICLE={'は':'wa','へ':'e','を':'o'};
function chunkMoras(k,hint){
  const k2=String(k||'').trim();if(PARTICLE[k2]&&(!hint||norm(hint)===PARTICLE[k2]))return[{t:k2,r:PARTICLE[k2]}];

}

let AC=null;
function tone(kind){if(!SET.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t0=AC.currentTime;
  const note=(f,d,len,vol,type='sine',slide)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0+d);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d+len);g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(vol,t0+d+.008);g.gain.exponentialRampToValueAtTime(.0005,t0+d+len);o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+len+.02)};
  if(kind===true){note(880,0,.16,.14);note(1318.5,.075,.32,.13);note(2637,.075,.18,.025,'triangle')}
  else if(kind===false){note(196,0,.22,.13,'triangle',150);note(146.8,.09,.3,.11,'triangle',110)}
  else if(kind==='tap'){note(1650,0,.035,.04,'triangle')}
  else if(kind==='key'){note(1200,0,.03,.035,'sine')}
  else if(kind==='done'){[523.25,659.25,783.99,1046.5].forEach((f,k)=>note(f,k*.09,.35,.12));note(2093,.36,.5,.04,'triangle')}
  else if(kind==='open'){note(420,0,.12,.03,'sine',780)}
  else if(kind==='flip'){note(660,0,.08,.05,'triangle',990)}
  if(navigator.vibrate&&(kind===false))navigator.vibrate(30)}catch(e){}}

/* ================= layers ================= */
const stack=[];
function push(theme,build,opts={}){
  const el=document.createElement('div');el.className=`layer t-${theme}${opts.up?' up':''}`;el.cleanup=[];
  if(!stack.length)sessionOpen();tone('open');$('#layers').appendChild(el);stack.push(el);keyHandler=null;build(el);
  el.getBoundingClientRect();requestAnimationFrame(()=>el.classList.add('in'));
  document.body.classList.add('has-layer');return el;
}
function pop(){
  const el=stack.pop();if(!el)return;keyHandler=null;
  el.cleanup.forEach(f=>{try{f()}catch(e){}});try{speechSynthesis.cancel()}catch(e){}
  el.classList.remove('in');el.classList.add('out');setTimeout(()=>el.remove(),300);
  if(!stack.length){sessionClose();document.body.classList.remove('has-layer');render()}
}

function mkItem(key,prompt,big,a,accept,pool,extra){const others=shuffle([...new Set(pool.filter(p=>norm(p)!==norm(a)))]).slice(0,3);return{type:'mc',key,prompt,big,a,accept:accept||[a],choices:shuffle([a,...others]),extra}}
function checkTyped(it,val){const v=norm(val);if(!v)return{ok:false};const acc=(it.accept||[it.a]).map(norm);if(acc.includes(v))return{ok:true};if(v.length>=5&&acc.some(a=>lev(a,v)<=(a.length>=9?2:1)))return{ok:true,typo:true};return{ok:false}}
const PRAISE=['Correct','Nice','That\'s it','Right'];

function lesson(cfg){
  /* cfg: theme,title,items,mode('mc'|'type'), onFinish(firstRight,total), again() */
  push(cfg.theme,el=>{
    const queue=cfg.items.map(it=>({...it,type:it.type||(cfg.mode==='type'?'type':'mc')}));
    const total=queue.filter(x=>x.type!=='intro'&&x.type!=='card').length,steps=queue.length;let i=0,first=0,cleared=0;const missed=[];
    el.innerHTML=`<header class="lhead"><button class="iconbtn" data-pop aria-label="Close">${ICON.close}</button><div class="pbar"><i style="width:0%"></i></div></header><div class="lbody"><div class="lin" id="L"></div></div><div class="lfoot" id="F" hidden><div class="in"></div></div><div class="fb" id="FB"><div class="in"></div></div>`;
    const L=el.querySelector('#L'),F=el.querySelector('#F'),FB=el.querySelector('#FB'),bar=el.querySelector('.pbar i');
    const prog=()=>bar.style.width=Math.max(4,cleared/steps*100)+'%';
    function show(){
      const it=queue[i];let done=false;FB.className='fb';F.hidden=true;keyHandler=null;el.querySelector('.lbody').scrollTop=0;
      L.innerHTML=`${it.retry?'<span class="tag" style="justify-self:start;color:var(--c)">Try this one again</span>':''}<p class="prompt">${esc(it.prompt)}</p>${it.big?`<div class="qcard">${it.big}</div>`:''}<div id="A"></div>`;
      const A=L.querySelector('#A');
      if(it.type==='card'){
        L.innerHTML=`<p class="prompt">${esc(it.prompt||'New word')}</p><div class="introcard wordcard pop"><div class="wbig" lang="${esc(it.lang)}"${it.rtl?' dir="rtl"':''}>${esc(it.t)}</div>${it.rom?`<div class="ksound">${esc(it.rom)}</div>`:''}<p class="wen">${esc(it.en)}</p>${sayBtn(it.t,it.lang)}</div>`;
        F.hidden=false;F.firstChild.innerHTML='<button class="btn c block" id="gotit">Got it</button>';say(it.t,it.lang);
        const go=()=>{if(done)return;done=true;cleared++;prog();tone('flip');next()};F.querySelector('#gotit').onclick=go;keyHandler=e=>{if(e.key==='Enter'){e.preventDefault();go()}};return}
      if(it.type==='intro'){const c=it.char;
        L.innerHTML=`<p class="prompt">New character</p><div class="introcard pop"><div class="kbig" lang="ja">${esc(c)}</div><div class="ksound">${esc(c==='っ'?'(pause)':romaOf(c))}</div><p>${esc(mnemo(c))}</p>${sayBtn(c)}</div>`;
        F.hidden=false;F.firstChild.innerHTML='<button class="btn c block" id="gotit">Got it</button>';say(c);
        const go=()=>{if(done)return;done=true;cleared++;prog();tone('flip');next()};F.querySelector('#gotit').onclick=go;keyHandler=e=>{if(e.key==='Enter'){e.preventDefault();go()}};return}
      const finish=(ok,given,typo)=>{
        if(done)return;done=true;tone(ok);logAnswer(ok,it.kb||kbFor(it));if(!it.retry){mark(it.key,ok);if(ok)first++;else missed.push(it)}
        if(ok||it.type==='pairs')cleared++;else queue.push({...it,retry:true,choices:it.choices&&shuffle(it.choices),tiles:it.tiles&&shuffle(it.tiles)});
        prog();F.hidden=true;
        const ansHtml=it.type==='tiles'&&it.chunks?`<span class="jp-ruby" style="font-size:1.6rem;line-height:2.1">${rubyChunks(it.chunks)}</span>`:esc(it.a);
        FB.className='fb '+(ok?'good':'bad');
        FB.firstChild.innerHTML=`<div class="top"><span class="badge">${ok?ICON.check:ICON.x}</span><h3>${it.type==='pairs'?(ok?'All matched':'Matched, with a few slips'):ok?(typo?'Right, check the spelling':pick(PRAISE)):'Correct answer:'}</h3></div>
          ${it.type!=='pairs'&&(!ok||typo||it.type==='tiles')?`<div class="ans">${ansHtml}</div>`:''}${!ok&&given?`<div class="ex">You said: ${esc(given)}</div>`:''}${it.extra?`<div class="ex">${esc(it.extra)}</div>`:''}${it.work?`<div class="work"><span>${it.workLabel||'How to solve it'}</span>${it.work.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`:''}
          <div class="row">${it.say?sayBtn(it.say,it.lang):''}${!ok&&it.type==='type'&&given?'<button class="btn sm" id="over">I was right</button>':''}<button class="btn block ${ok?'good':'bad'}" id="cont">Continue</button></div>`;
        requestAnimationFrame(()=>FB.classList.add('show'));
        const c=FB.querySelector('#cont');c.onclick=next;setTimeout(()=>c.focus({preventScroll:true}),60);
        const ov=FB.querySelector('#over');if(ov)ov.onclick=()=>{queue.pop();cleared++;first++;missed.pop();STATS[it.key].w--;STATS[it.key].r++;store.set('stats',STATS);prog();FB.className='fb good show';FB.querySelector('h3').textContent='Counted as right';ov.remove()};
        if(ok&&it.say)say(it.say,it.lang);
        keyHandler=e=>{if(e.key==='Enter'){e.preventDefault();next()}};
      };
      if(it.type==='mc'){
        A.innerHTML=`<div class="opts${it.choices.some(c=>String(c).length>26)?' one':''}">${it.choices.map((c,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd><span class="${it.optClass||''}"${it.optLang?` lang="${it.optLang}"`:it.optClass?' lang="ja"':''}${it.optRtl?' dir="rtl"':''}>${esc(c)}</span></button>`).join('')}</div>`;
        const bs=$$('.opt',A);
        const choose=k=>{if(done)return;const ok=norm(it.choices[k])===norm(it.a);bs.forEach((b,j)=>{b.disabled=true;if(norm(it.choices[j])===norm(it.a))b.classList.add('right');else if(j===k)b.classList.add('wrong')});finish(ok,ok?'':it.choices[k])};
        bs.forEach(b=>b.onclick=()=>choose(+b.dataset.k));
        keyHandler=e=>{const n=+e.key;if(n>=1&&n<=bs.length){e.preventDefault();choose(n-1)}};
      }else if(it.type==='pairs'){
        const L2=shuffle(it.pairs.map((p,k)=>({k,h:p[0]}))),R2=shuffle(it.pairs.map((p,k)=>({k,h:p[1]})));let sel=null,left=it.pairs.length,miss=0;
        A.innerHTML=`<div class="pairs"><div>${L2.map(x=>`<button class="pr" data-s="l" data-k="${x.k}">${x.h}</button>`).join('')}</div><div>${R2.map(x=>`<button class="pr" data-s="r" data-k="${x.k}">${x.h}</button>`).join('')}</div></div>`;
        A.onclick=e=>{const b=e.target.closest('.pr');if(!b||b.disabled||done)return;
          if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('on');sel=b;b.classList.add('on');const ch=it.pairs[+b.dataset.k][0].match(/>([^<]+)</);if(b.dataset.s==='l'&&ch)say(ch[1]);return}
          if(sel.dataset.k===b.dataset.k){[sel,b].forEach(x=>{x.classList.remove('on');x.classList.add('ok');x.disabled=true});tone(true);sel=null;if(--left===0)setTimeout(()=>finish(miss<=1),250)}
          else{miss++;tone(false);[sel,b].forEach(x=>{x.classList.remove('on');x.classList.add('no');setTimeout(()=>x.classList.remove('no'),400)});sel=null}};
      }else if(it.type==='tap'){
        A.innerHTML=`<div class="bodywrap one">${it.svg}</div>`;
        $$('.part',A).forEach(g=>g.onclick=()=>{if(done)return;const id=g.dataset.id,ok=id===it.target;g.classList.add(ok?'right':'wrong');const c=A.querySelector(`[data-id="${it.target}"]`);if(c)c.classList.add('right');finish(ok,ok?'':it.nameOf(id))});
      }else if(it.type==='map'){
        A.innerHTML=`<div class="mapwrap">${mapSVG(null,'tap')}</div>`;
        A.querySelector('.usmap').onclick=e=>{const p=e.target.closest('[data-ab]');if(!p||done)return;const ok=p.dataset.ab===it.ab;p.classList.add(ok?'right':'wrong');const c=A.querySelector(`[data-ab="${it.ab}"]`);if(c)c.classList.add('right');finish(ok,ok?'':STATE_BY[p.dataset.ab].name)};
      }else if(it.type==='type'){
        A.innerHTML=`<input class="answer-in" id="ain" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" enterkeyhint="done">`;
        F.hidden=false;F.firstChild.innerHTML='<button class="btn c block" id="chk">Check</button>';
        const inp=A.querySelector('#ain');setTimeout(()=>inp.focus({preventScroll:true}),320);
        const go=()=>{if(done)return;const v=inp.value.trim();inp.blur();if(!v){finish(false,'');return}const r=checkTyped(it,v);finish(r.ok,v,r.typo)};
        F.querySelector('#chk').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();go()}};
      }else if(it.type==='tiles'){
        const TL=it.lang||'ja',dir=it.rtl?' dir="rtl"':'';const tlab=t=>esc(t)+(it.tileRom&&it.tileRom[t]?`<small>${esc(it.tileRom[t])}</small>`:'');
        A.innerHTML=`<div class="tline" id="tl"${dir}></div><div class="tbank" id="tb"${dir}>${it.tiles.map((t,k)=>`<button class="tl" data-t="${k}" lang="${TL}">${tlab(t)}</button>`).join('')}</div>`;
        F.hidden=false;F.firstChild.innerHTML='<button class="btn c block" id="chk" disabled>Check</button>';
        const picked=[],tl=A.querySelector('#tl'),tb=A.querySelector('#tb'),chk=F.querySelector('#chk');
        const draw=()=>{tl.innerHTML=picked.map((k,p)=>`<button class="tl" data-p="${p}" lang="${TL}">${tlab(it.tiles[k])}</button>`).join('');$$('.tl',tb).forEach(b=>b.disabled=picked.includes(+b.dataset.t));chk.disabled=!picked.length};
        tb.onclick=e=>{const b=e.target.closest('[data-t]');if(!b||done||b.disabled)return;picked.push(+b.dataset.t);draw()};
        tl.onclick=e=>{const b=e.target.closest('[data-p]');if(!b||done)return;picked.splice(+b.dataset.p,1);draw()};
        chk.onclick=()=>{if(done)return;chk.disabled=true;$$('.tl',el).forEach(b=>b.disabled=true);finish(picked.map(k=>it.tiles[k]).join('\u0001')===it.ans.join('\u0001'))};
      }
    }
    function next(){i++;if(i<queue.length)show();else end()}
    function end(){
      keyHandler=null;FB.className='fb';F.hidden=false;bar.style.width='100%';
      if(cfg.onFinish)cfg.onFinish(first,total);
      tone('done');
      L.innerHTML=`<div class="sum"><div class="burst" aria-hidden="true">${Array.from({length:14},(_,k)=>`<i style="--a:${k*360/14}deg;--d:${60+(k%3)*22}px;--h:${['var(--green)','var(--blue)','var(--yellow)','var(--purple)','var(--red)','var(--orange)'][k%6]}"></i>`).join('')}</div><div class="big"><span id="cu">0</span><span style="font-size:.5em;color:var(--muted)">/${total}</span></div><p class="of">right on the first try${cfg.nextLabel?'':''}</p>
        ${missed.length?`<p class="muted" style="font-weight:700">Worth another look. These come up more often from now on.</p><ul class="misslist">${missed.map(m=>`<li><span>${m.missLabel||esc(m.missText||m.prompt)}</span><b style="color:var(--c)">${esc(m.a)}</b></li>`).join('')}</ul>`:'<p class="muted" style="font-weight:700">Clean round.</p>'}</div>`;
      {const cu=L.querySelector('#cu');let v=0;const step=()=>{if(!cu.isConnected)return;cu.textContent=v;if(v<first){v++;setTimeout(step,Math.max(30,400/Math.max(1,first)))}};step()}
      F.firstChild.innerHTML=`${missed.length?'<button class="btn" id="redo">Practice misses</button>':''}${cfg.nextLabel?`<button class="btn c" id="nx">${esc(cfg.nextLabel)}</button>`:'<button class="btn c" id="again">Go again</button>'}`;
      const r=F.querySelector('#redo');if(r)r.onclick=()=>{pop();setTimeout(()=>lesson({...cfg,items:shuffle(missed.map(m=>({...m,retry:false,choices:m.choices&&shuffle(m.choices),tiles:m.tiles&&shuffle(m.tiles)}))),onFinish:null,nextLabel:null,again:null}),120)};
      const a=F.querySelector('#again');if(a)a.onclick=()=>{pop();setTimeout(()=>cfg.again?cfg.again():lesson(cfg),120)};
      const n=F.querySelector('#nx');if(n)n.onclick=()=>{pop();setTimeout(()=>cfg.next&&cfg.next(),120)};
    }
    prog();show();
  },{up:true});
}

function genSeq(){
  const t=rnd(0,6);let s=[],a=rnd(1,12),d=rnd(2,9),why;
  if(t===0){for(let i=0;i<6;i++)s.push(a+d*i);why=`Add ${d} each time.`}
  else if(t===1){const r=rnd(2,3);a=rnd(1,5);for(let i=0;i<6;i++)s.push(a*r**i);why=`Multiply by ${r} each time.`}
  else if(t===2){for(let i=1;i<=6;i++)s.push(i*i+a);why=`Square numbers plus ${a}: 1²+${a}, 2²+${a}, and so on.`}
  else if(t===3){let x=a,y=rnd(1,9);s=[x,y];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2]);why='Each number is the sum of the two before it.'}
  else if(t===4){const e=rnd(2,6);s=[a];for(let i=1;i<6;i++)s.push(s[i-1]+(i%2?d:-e));why=`Alternate: add ${d}, then subtract ${e}.`}
  else if(t===5){s=[a];for(let i=1;i<6;i++)s.push(s[i-1]+i+1);why='The gap grows by one each time: +2, +3, +4, +5, +6.'}
  else{for(let i=1;i<=6;i++)s.push(i*(i+1));why='n × (n+1): 1×2, 2×3, 3×4, and so on.'}
  const ans=s.pop();const c=new Set([ans]);while(c.size<4)c.add(ans+pick([-3,-2,-1,1,2,3,4,-4,5,6,ans>20?10:7]));const ch=shuffle([...c].map(String));
  return{q:'What comes next?',big:s.join(',  ')+',  ?',c:ch,a:ch.indexOf(String(ans)),e:why+` So the next number is ${ans}.`};
}

        requestAnimationFrame(()=>FB.classList.add('show'));FB.querySelector('#nx').onclick=next;keyHandler=e=>{if(e.key==='Enter'){e.preventDefault();next()}}};
      bs.forEach(b=>b.onclick=()=>choose(+b.dataset.k));
      keyHandler=e=>{const n=+e.key;if(n>=1&&n<=bs.length){e.preventDefault();choose(n-1)}};
    }
    if(src==='ai')aiSetup();else next();

const samplePromise=(async()=>{try{return(window.claude&&await window.claude.use('sample'))||null}catch(e){return null}})();
function parseJSON(t){t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:'invalid_json'}}
async function askJSON(prompt,o={}){
  const s=window.claude?await samplePromise:null;
  if(s){const so={modelTier:o.quick?'quick':'default'};if(o.fresh)so.cache=false;if(o.signal)so.signal=o.signal;return s.json(prompt,so)}
  if(!SET.key)throw{code:'nokey'};
  if(!navigator.onLine)throw{code:'offline'};
  const models=[...new Set(o.quick?['claude-haiku-5-5','claude-haiku-4-5','claude-sonnet-5-5']:[SET.model,'claude-sonnet-5-5','claude-opus-5-5'])];
  let last=null;
  for(const model of models){
    let res;try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:o.signal,headers:{'content-type':'application/json','x-api-key':SET.key.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:2000,messages:[{role:'user',content:prompt+'\n\nReply with only the JSON value, no other text.'}]})})}
    catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:navigator.onLine?'network':'offline'}}
    if(res.ok){const j=await res.json();return parseJSON((j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(''))}
    let msg='',type='';try{const j=await res.json();msg=(j.error&&j.error.message)||'';type=(j.error&&j.error.type)||''}catch(e){}
    const detail=`Error ${res.status}${type?' ('+type+')':''}${msg?': '+msg:''}`;
    if(res.status===404||(res.status===400&&/model/i.test(msg))){last={code:'upstream_error',detail};continue}
    if(/workspace/i.test(msg))throw{code:'workspace',detail};
    if(res.status===401||res.status===403)throw{code:'badkey',detail};
    if(/credit|billing|balance|payment/i.test(msg))throw{code:'nocredit',detail};
    if(res.status===429)throw{code:'rate_limited',detail};
    if(res.status>=500)throw{code:'busy',detail};
    throw{code:'upstream_error',detail};
  }
  throw last||{code:'upstream_error'};
}

const KMN={

'さ':'Like き missing a line. It looks sad: "sa."','し':'A fishhook. She caught a fish: "shi."','す':'A swing with a loop: "su."','せ':'A mouth with one big tooth saying "say."','そ':'A zigzag sewing thread: "so."',

'や':'A yak with horns: "ya."','ゆ':'A fish swimming in a U-turn: "yu."','よ':'A yo-yo hanging from a string: "yo."',
'ら':'Looks like a 5 with a hat. "Rad": "ra."','り':'Two reeds blowing in the wind: "ri."','る':'A route with a loop at the end: "ru."','れ':'A person kneeling and stretching a leg out: "re."','ろ':'Like る without the loop, a road with no roundabout: "ro."',
'わ':'A swan waddling: "wa."','を':'Someone falling over going "whoa!" Read as "o" when it\'s a particle.','ん':'Looks like a cursive lowercase n: "n."'

function mnemo(c){
  if(KMN[c])return KMN[c];
  if(c==='っ')return'A small つ isn\'t a sound. It\'s a tiny pause that doubles the next consonant: きっぷ = kip-pu.';
  if(c.length===2)return`${c[0]} + a small ${c[1]} blend into one quick sound: "${romaOf(c)}."`;
  const code=c.charCodeAt(0);const dak='がぎぐげござじずぜぞだぢづでどばびぶべぼ'.includes(c),han='ぱぴぷぺぽ'.includes(c);
  if(dak||han){const base=String.fromCharCode(code-(han?2:1));return`Same shape as ${base} (${romaOf(base)}) plus ${han?'a little circle (゜)':'two little marks (゛)'}, which turns it into "${romaOf(c)}."`}
  return'';
}
const LESSONS=(()=>{const out=[];const known=[];
  PATH.forEach((u,ui)=>{
    if(u.k){const chars=u.k.split(' ');let groups=[];
      if(chars.length<=3)groups=[chars];
      else if(chars.length<=5)groups=[chars.slice(0,3),chars.slice(3)];
      else if(chars.includes('が')){const cut=[0,5,10,13,18,23];groups=cut.slice(0,-1).map((c,k)=>chars.slice(c,cut[k+1]))}
      else{for(let i=0;i<chars.length;i+=4)groups.push(chars.slice(i,i+4));if(groups.length>1&&groups[groups.length-1].length<3){const l=groups.pop();groups[groups.length-1].push(...l)}}
      groups.forEach((g,gi)=>{out.push({id:`h${ui}-${gi}`,unit:u.s,title:groups.length>1?`${u.t} ${gi+1}`:u.t,label:g[0],kind:'kana',newChars:g,known:[...known],tip:gi===0?u.tip:null,row:ui});known.push(...g)});

function unitExercises(i){

  const soundOf=c=>c==='っ'?'(pause)':romaOf(c);
  const mcSound=(c,pool)=>{const opts=[...new Set(shuffle(pool.filter(x=>x!==c&&x!=='っ')).map(soundOf))].filter(s=>s!==soundOf(c)).slice(0,3);return{type:'mc',key:'pk:'+c,prompt:'Which sound is this?',big:`<span class="kana" lang="ja">${c}</span>`,a:soundOf(c),choices:shuffle([soundOf(c),...opts]),say:c,work:[mnemo(c)],workLabel:'Remember it',missLabel:`<span class="jp-hand" style="font-size:1.5rem">${c}</span>`}};
  const mcChar=(c,pool)=>{const opts=shuffle(pool.filter(x=>x!==c&&x!=='っ'&&soundOf(x)!==soundOf(c))).slice(0,3);return{type:'mc',key:'kf:'+c,prompt:`Which one is "${soundOf(c)}"?`,big:'',a:c,choices:shuffle([c,...opts]),optClass:'kana-opt',say:c,work:[mnemo(c)],workLabel:'Remember it',missText:soundOf(c)}};
  const readWord=w=>{const means=[...new Set(PATH_WORDS.map(x=>x[1]))].filter(m=>m!==w[1]);return{type:'mc',key:'pm:'+w[0],prompt:'What does this mean?',big:`<span class="jp-ruby" lang="ja">${rubyChunks(wordChunks(w))}</span>`,a:w[1],choices:shuffle([w[1],...shuffle(means).slice(0,3)]),say:w[0],missLabel:`<span class="jp-hand" style="font-size:1.3rem">${esc(w[0])}</span>`}};
  if(L.kind==='kana'){

      if(c==='っ'){seq.push({type:'mc',key:'pk:っ',prompt:'What does a small っ do?',big:'<span class="kana" lang="ja">っ</span>',a:'Adds a tiny pause that doubles the next sound',choices:shuffle(['Adds a tiny pause that doubles the next sound','Sounds like "tsu"','Makes the word a question','Nothing, it\'s silent decoration']),work:[mnemo('っ')],workLabel:'Remember it',missText:'small っ'});return}
      if(pool().filter(x=>x!=='っ').length>=2){if(k===1&&!L.known.length)seq.push(mcSound(L.newChars[0],pool()));seq.push(mcSound(c,pool()))}});
    shuffle(L.newChars.filter(c=>c!=='っ')).forEach(c=>{if(pool().filter(x=>x!=='っ').length>=2)seq.push(mcChar(c,pool()))});

    if(L.known.length)shuffle(L.known.filter(c=>c!=='っ')).slice(0,2).forEach(c=>seq.push(mcSound(c,pool())));
    const can=new Set(pool());const readable=PATH_WORDS.filter(w=>!w[0].includes(' ')&&moras(w[0]).every(m=>[...m.t].every(ch=>can.has(ch)||can.has(m.t))));

const COUNTRY_BY=Object.fromEntries(COUNTRIES.map(c=>[c.code,c]));

function kbFor(it){
  const k=String(it.key||'');const p=k.slice(0,k.indexOf(':')),v=k.slice(k.indexOf(':')+1);const C=COUNTRY_BY[v],S=STATE_BY[v];
  switch(p){
    case'f':return C&&{k:'flag:'+v,t:'Flag of '+C.name,d:'Capital: '+C.capital,c:'Flags',i:'@'+v};
    case'c':case'k':return C&&{k:'cap:'+v,t:`${C.capital} is the capital of ${C.name}`,d:CAP_NOTES[v]||'',c:'Capitals',i:'@'+v};
    case't':return C&&{k:'cont:'+v,t:`${C.name} is in ${CONT[C.cont]}`,c:'Continents',i:'@'+v};
    case'h':case'b':case'q':return{k:'cf:'+v,t:p==='h'?`${stripTags(it.big)} is the highest point in ${it.a}`:p==='b'?`${v} is the largest country in ${it.a}`:`${it.a} ${stripTags(it.big).toLowerCase()}`,c:'Continents'};
    case'u':return S&&{k:'usc:'+v,t:`${S.capital} is the capital of ${S.name}`,c:'US states'};
    case'a':return S&&{k:'usa:'+v,t:`${v} stands for ${S.name}`,c:'US states'};
    case'r':return S&&{k:'usr:'+v,t:`${S.name} is in the ${S.region}`,c:'US states'};
    case'cp':return{k:k,t:`${it.prompt.replace(/[?]$/,'')} ${stripTags(it.big).replace(/___$/,'')}: ${it.a}`.replace('  ',' '),c:'Directions'};
    case'ud':case'un':{const n=+v;return UDHR[n]&&{k:'udhr:'+n,t:`Article ${n+1}: ${UDHR[n][0]}`,d:UDHR[n][1],c:'Human rights'}}

    case'kn':case'kf':case'pk':return{k:'kana:'+v,t:`${v} sounds like "${romaOf(v)}"`,c:'Japanese',i:v};
    case'pm':case'pt':{const w=PATH.flatMap(u=>u.w).find(x=>x[0]===v);return w&&{k:'jw:'+v,t:`${v.replace(/ /g,'')} means "${w[1]}"`,d:w[2]||romaOf(v.replace(/ /g,'')),c:'Japanese',i:''}}

const CAT={Flags:['world','flag'],Capitals:['world','capitol'],Continents:['world','globe'],'US states':['world','star'],Directions:['world','compass'],'Human rights':['world','scroll'],Words:['words','aa'],Grammar:['words','pencil'],Japanese:['jp','',' あ'],Math:['mind','mix'],Units:['mind','hash'],Science:['mind','bolt'],Civics:['world','capitol'],Geography:['world','globe'],History:['world','book'],'Fun facts':['fact','sparkle'],Sayings:['words','speech'],Languages:['jp','speech']};

function rangeStart(r){const n=new Date();if(r==='week'){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}if(r==='month')return new Date(n.getFullYear(),n.getMonth(),1);if(r==='year')return new Date(n.getFullYear(),0,1);return new Date(2000,0,1)}

function reviewPool(){

  try{for(const d of['flags','capitals','countries','continent','cfacts','uscap','usab','usreg','compass'])all.push(...geoItems(d))}finally{G.cont=keep}

function dumbItems(n){
  const easyTerms=MTERMS.map((t,i)=>[t,i]).filter(([t])=>/Elementary|Middle/.test(t[1])).map(([,i])=>i);
  const pool=[...BASICS.map((_,i)=>basicItem(i)),...termItems(easyTerms)];
  const keep=G.cont;G.cont='UN';let caps=[];try{caps=geoItems('capitals').filter(x=>['US','CA','MX','GB','FR','DE','IT','ES','JP','CN','IN','BR','AU','RU','EG','KR','TR','AR','ZA','NG'].includes(x.key.slice(2)))}finally{G.cont=keep}
  pool.push(...caps,...geoItems('uscap').filter(x=>['NY','CA','TX','FL','IL','PA','WA','NV','KY','SD','VT','MO','MI'].includes(x.key.slice(2))));
  const missed=reviewPool().filter(it=>STATS[it.key]&&STATS[it.key].w>0);
  return shuffle([...prioritize(missed,Math.min(3,missed.length)),...prioritize(pool,n-Math.min(3,missed.length))]).slice(0,n);
}

let DICT=null,DICTP=null;
const POSN={n:'noun',v:'verb',adj:'adjective',adv:'adverb'};
function loadDict(){if(DICT)return Promise.resolve(DICT);if(!DICTP)DICTP=fetch('dict.json').then(r=>{if(!r.ok)throw new Error('dict');return r.json()}).then(d=>{DICT=d;return d}).catch(e=>{DICTP=null;throw e});return DICTP}
function openDictBook(){
  push('words',el=>{
    let letter='a',q='',mode='worth',shown=150;
    page(el,'Dictionary',`<div class="hero">${bi('book',{s:76})}<h2>Dictionary</h2><p class="status"><span class="spin" style="border-color:var(--line);border-top-color:var(--purple)"></span>Opening the dictionary</p></div>`);
    loadDict().then(draw).catch(()=>{if(el.isConnected)page(el,'Dictionary',`<div class="hero">${bi('book',{s:76})}<h2>Dictionary</h2><p class="status err">Couldn't load the dictionary. Check your connection and open it again.</p></div>`)});
    function list(){
      if(q){const out=[];for(const e of DICT){if(e[0].startsWith(q))out.push(e);if(out.length>=shown)break}return out}
      return DICT.filter(e=>e[0][0]===letter&&(mode==='all'||(e[1]>=1&&e[1]<=12)))};
    function draw(){if(!el.isConnected)return;
      const L=list();const total=L.length;const vis=L.slice(0,shown);
      const lin=page(el,'Dictionary',`<div class="hero">${bi('book',{s:76})}<h2>Dictionary</h2><p>${DICT.length.toLocaleString()} words. Browse by letter or start typing.</p></div>

        ${q?'':`<div class="letters" id="ab">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c=>`<button data-l="${c}" aria-pressed="${c===letter}">${c.toUpperCase()}</button>`).join('')}</div>

        <div class="list">${vis.map(e=>`<button class="li term" data-w="${esc(e[0])}"><div style="min-width:0;text-align:left"><b>${esc(e[0])}</b><span class="s">${esc(POSN[e[2][0][0]]||'')} · ${esc(e[2][0][1])}</span></div></button>`).join('')||'<p class="empty">No words found.</p>'}</div>
        ${total>shown?`<button class="btn block" id="more">Show more (${(total-shown).toLocaleString()} left)</button>`:''}`);

      el.querySelector('#rnd').onclick=()=>{const pool=DICT.filter(e=>e[1]>=1&&e[1]<=6);wordPage(pick(pool)[0])};
      lin.onclick=e=>{const b=e.target.closest('[data-w]');if(b)wordPage(b.dataset.w)};

  });

const TUTOR_RULES=`You are a patient tutor for Gabe, a 10th grader in Geometry Honors. He learns best with plain, friendly explanations.

HOW TO SOLVE MATH (always):
- Solve it the way a teacher shows work on paper, never the way a computer would.
- First line: what the problem is asking. Then "Given:" with what you know.
- Number every step. Each step is one line of math a student would actually write, then a dash and a short reason in plain words (the property, theorem or definition, like "Vertical Angles Theorem" or "Subtract 5 from both sides").
- Keep answers exact: fractions, radicals like 5√2, answers in terms of π. Only round if the problem says to.
- Use the notation teachers use: ∠ABC, m∠A, ≅, ∥, ⊥, △ABC, x², √, π, ≠, ≤, ≥. Never use LaTeX, code, or computer notation like *, ^, sqrt() or $.
- For proofs, write a two-column list: "Statements | Reasons", one numbered row per line.
- End with the final answer on its own line starting with "**Answer:**".
- Then one or two sentences starting with "**Why this works:**".

IF ASKED WHAT A TERM OR WORD MEANS:
**Definition:** …
**Simple way to think about it:** …
**How it shows up in problems:** …
**Example:** a short worked example (shown the paper way).

PRACTICE PROBLEMS:
- When he asks for a practice problem, give ONE problem of the same type and difficulty, labeled "**Practice problem**". Do NOT show the answer or hints. Tell him to try it and send his work (typed or a photo).
- When he sends his answer or work for a practice problem, start with "✅ **Correct**" or "❌ **Not quite**". Then check his work line by line. If something is wrong, quote the first wrong line and explain the mistake simply. Only show the full correct solution (the teacher way) if he got it wrong. If the answer is right but the work wouldn't get full credit (skipped steps, missing reasons, wrong notation), say exactly what to add. End by asking if he wants another one.

SIMPLER WAY: when he says he doesn't get it or asks for a simpler way to think about something, give a really easy way to think about it: an everyday comparison or a memory trick, in under 5 sentences, then one tiny example.

QUICK REVIEW BEFORE A TEST: when he asks for a review of a topic, give (1) the key terms, each with a one-line simple way to think about it, (2) the 2–3 types of problems he'll see, each with one short worked example the teacher way, (3) the top mistakes to avoid. Then offer practice problems.

STYLE: short paragraphs, **bold** for key words, no walls of text. If a photo is blurry or cut off, say exactly what you can't read instead of guessing. If he asks you to just give answers to graded work, still show the steps so he can learn it.`;

function mdLite(t){
  const lines=esc(t).split('\n');let html='',inList=null;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const close=()=>{if(inList){html+=`</${inList}>`;inList=null}};
  for(const raw of lines){const l=raw.trimEnd();
    let m;
    if(/^#{1,4}\s/.test(l)){close();html+=`<p class="mh">${inline(l.replace(/^#+\s*/,''))}</p>`}
    else if((m=l.match(/^\s*(\d+)[.)]\s+(.*)/))){if(inList!=='ol'){close();html+='<ol>';inList='ol'}html+=`<li value="${m[1]}">${inline(m[2])}</li>`}
    else if((m=l.match(/^\s*[-•]\s+(.*)/))){if(inList!=='ul'){close();html+='<ul>';inList='ul'}html+=`<li>${inline(m[1])}</li>`}
    else if(/^\s*\|/.test(l)){close();if(/^\s*\|?\s*-{2,}/.test(l))continue;html+=`<div class="trow">${l.split('|').filter((c,i,a)=>!(i===0&&!c.trim())&&!(i===a.length-1&&!c.trim())).map(c=>`<span>${inline(c.trim())}</span>`).join('')}</div>`}
    else if(!l.trim()){close()}
    else{close();html+=`<p>${inline(l)}</p>`}}
  close();return html;
}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}finally{URL.revokeObjectURL(url)}
}

['What they say next','A coworker at your job says, "Hey, are you doing anything Saturday?" and then pauses.','What is the most likely reason for the question?','They\'re about to ask you to cover their shift.',['They want to know your hobbies','They\'re planning a surprise party for you','They\'re bored'],'At a job, "Are you doing anything [day]?" with a pause usually leads to a favor, most often swapping a shift.'],
['What they say next','Your friend shows you a drawing and says, "Be honest, is it bad?" Their voice is quiet and they\'re not smiling.','What answer are they most likely hoping for?','Honest but kind feedback: what\'s good, plus one thing to improve.',['Brutal criticism','"It\'s the best thing I\'ve ever seen"','A change of subject'],'"Be honest" plus a nervous tone means they want the truth, gently. Over-the-top praise feels fake; harsh criticism hurts.'],
['What they say next','A salesperson says, "This phone is great, but honestly, for what you need…"','How will this sentence most likely end?','"…you\'d be better off with the cheaper model."',['"…you should buy two."','"…this is the only one that works."','"…you don\'t need a phone."'],'"But honestly" signals a turn toward the opposite of what came before: a recommendation for something different, usually cheaper or simpler.'],
['What happens next','It\'s 3:05. The bus usually comes at 3:10. You see kids running toward the bus stop from the other direction.','What most likely happened?','The bus is early or about to arrive.',['The bus is canceled','School got let out late','It\'s about to rain'],'People running toward a stop is a clue the bus is coming now. Other people\'s behavior gives information you can\'t see.'],
['What happens next','You leave a full glass of ice water on a table outside on a hot day. An hour later you come back.','What will you most likely find?','Mostly water, no ice, and water droplets on the outside of the glass.',['The ice is still frozen','The glass is empty','The water turned warm and the ice grew'],'Heat melts the ice. Water vapor in the warm air condenses on the cold glass, which is why it "sweats."'],

['What happens next','A team is up by 20 points with 2 minutes left in a basketball game.','What will the winning coach most likely do?','Put in the bench players.',['Call a timeout to yell at the team','Pull the goalie','Go for more three-pointers'],'With the game basically won, coaches rest starters to avoid injuries and give backups playing time.'],
['What happens next','You study for 20 minutes a day all week. Your friend studies for 3 hours the night before the test.','Who most likely remembers more a month later?','You, because spread-out practice sticks better.',['Your friend, because he studied more total','Neither remembers anything','It\'s exactly the same'],'Spacing practice over days beats cramming for long-term memory, even with less total time. It\'s called the spacing effect.'],
['What happens next','The sky gets dark green-gray, the wind suddenly picks up, and the temperature drops fast.','What is most likely coming?','A strong thunderstorm.',['A sunny afternoon','A heat wave','Snow in summer'],'A sudden temperature drop and gusty wind usually mean a storm\'s cold air is arriving right before it hits.'],

['Read the room','Your group project partner says, "It\'s fine, I\'ll just do the slides myself," and stops replying in the group chat.','What is most likely true?','They\'re frustrated that others aren\'t doing their part.',['They love doing slides','They\'re fine with everything','They forgot about the project'],'"It\'s fine, I\'ll just…" plus going quiet usually means it\'s not fine. They feel like they\'re doing all the work.'],

['What they say next','The coach gathers the team after a loss and says, "I\'m not going to yell. I just want to ask one question."','What is the coach most likely to ask?','Something like "Did we give our best effort today?"',['"Who wants pizza?"','"What\'s everyone doing this weekend?"','"Who scored the most?"'],'After a loss, a calm "one question" is usually about effort or responsibility, to make the team reflect.'],
['Read the room','In class, the teacher asks a question. Total silence. She waits, then says, "I\'ll wait."','What is she most likely signaling?','She expects someone to try, even if they aren\'t sure.',['She\'s about to give the answer','Class is over','She\'s angry and will give detention'],'"I\'ll wait" means she wants participation, not perfection. Someone answering, even wrong, moves things forward.']
].map(([k,sit,q,a,w,why],i)=>({kind:k,sit,type:'mc',key:'pr:'+i,prompt:q,big:`<span class="bigdef" style="font-size:1.08rem;text-align:left;display:block"><span class="tag" style="margin-bottom:8px;display:inline-block">${esc(k)}</span><br>${esc(sit)}</span>`,a,choices:shuffle([a,...w]),work:[why],workLabel:'The clues',kb:{k:'pr:'+i,t:`Prediction: ${sit.slice(0,90)}${sit.length>90?'…':''}`,d:a,c:'Reasoning'},missText:q}));
async function freshPredictions(n){
  const r=await askJSON(`Write ${n} short "predict what happens next" scenarios that train a high-school student to read context and make inferences. Mix these kinds: what someone will say next, what will happen next (cause and effect), reading the room (body language, tone), and spotting clues. Make them realistic for a teenager's life (school, friends, family, sports, a part-time job, online). Each must have one clearly MOST LIKELY answer and three less likely ones, and the explanation must name the exact clues.
Reply with only JSON: [{"kind":"What they say next|What happens next|Read the room|Spot the clue","situation":"2-3 sentences","question":"...","answer":"most likely answer","wrong":["…","…","…"],"clues":"1-3 sentences explaining which clues point to the answer"}]
Seed: ${Math.random().toString(36).slice(2,8)}`,{fresh:true});
  if(!Array.isArray(r))throw{code:'invalid_json'};
  return r.filter(x=>x&&x.situation&&x.answer&&Array.isArray(x.wrong)).map((x,i)=>({type:'mc',key:'prx:'+Date.now()+i,prompt:x.question||'What\'s most likely?',big:`<span class="bigdef" style="font-size:1.08rem;text-align:left;display:block"><span class="tag" style="margin-bottom:8px;display:inline-block">${esc(x.kind||'Predict')}</span><br>${esc(x.situation)}</span>`,a:x.answer,choices:shuffle([x.answer,...x.wrong.slice(0,3)]),work:[x.clues||''],workLabel:'The clues',kb:{k:'prx:'+norm(x.situation).slice(0,40),t:`Prediction: ${x.situation.slice(0,90)}…`,d:x.answer,c:'Reasoning'},missText:x.question}));
}

    page(el,'Predict it',`<div class="hero">${bi('sparkle',{s:76})}<h2>Predict it</h2><p>Read a situation, pick up the clues, and predict what someone will say or what happens next. Every answer shows the clues you should have noticed.</p></div>
      <div class="rows">
        <button class="rowcard t-mind" id="b">${bi('dots',{s:52})}<span><b>Quick round</b><span class="d">10 situations, multiple choice</span></span>${ICON.chev}</button>
        <button class="rowcard t-mind" id="w">${bi('pencil',{s:52})}<span><b>Write your prediction</b><span class="d">Say it in your own words. Claude rates it and shows the clues.</span></span>${ICON.chev}</button>
        <button class="rowcard t-mind" id="a">${bi('sparkle',{s:52})}<span><b>Fresh situations</b><span class="d">New ones from Claude every time</span></span>${ICON.chev}</button>
      </div><p class="status" id="st"></p>`);
    const go=()=>lesson({theme:'mind',items:prioritize(PREDICT,10),again:go,onFinish:()=>markDone('predict')});
