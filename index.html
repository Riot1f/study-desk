    el.querySelector('#a').onclick=async e=>{const st=el.querySelector('#st');st.className='status';st.innerHTML='<span class="spin" style="border-color:var(--line);border-top-color:var(--orange)"></span>Writing new situations';
      try{const items=await freshPredictions(6);st.textContent='';if(items.length)lesson({theme:'mind',items,again:()=>el.querySelector('#a').click()})}catch(x){showAiError(st,x)}};
    el.querySelector('#w').onclick=()=>predictWrite();

function predictWrite(){
  push('mind',el=>{
    let sc=null;
    const next=async()=>{
      const pool=PREDICT;sc=pick(pool);
      page(el,'Write your prediction',`<div class="card"><span class="eyebrow">${esc(sc.kind)}</span><p style="color:var(--head);font-size:1.08rem">${esc(sc.sit)}</p><p style="color:var(--head);font-weight:900">${esc(sc.prompt)}</p></div>
        <textarea class="ta" id="pv" placeholder="What do you predict, and why? Mention the clues you noticed."></textarea><p class="status" id="st"></p><div class="out" id="out"></div>`,
        '<button class="btn" id="sk">Skip</button><button class="btn c" id="ck">Check</button>');
      el.querySelector('#sk').onclick=next;
      el.querySelector('#ck').onclick=async e=>{const v=el.querySelector('#pv').value.trim();const st=el.querySelector('#st');if(!v){st.className='status err';st.textContent='Write your prediction first.';return}
        busy(e.target,'Checking');
        try{const r=await askJSON(`A student is practicing prediction and inference. Rate his prediction for this situation.
Situation: ${sc.sit}
Question: ${sc.prompt}
The most likely answer: ${sc.a}
The key clues: ${sc.work[0]}
His prediction: """${v.slice(0,800)}"""
Reply with only JSON: {"rating":"Spot on" or "Reasonable" or "Unlikely","feedback":"2-3 friendly sentences on what he got right and what he missed","cluesHeUsed":["…"],"cluesHeMissed":["…"]}`,{fresh:true});
          const good=r.rating==='Spot on',ok=r.rating==='Reasonable';tone(good||ok);logAnswer(good||ok,sc.kb);
          el.querySelector('#out').innerHTML=`<div class="card pop"><span class="eyebrow" style="color:${good?'var(--good-ink)':ok?'var(--orange)':'var(--bad-ink)'}">${esc(r.rating||'')}</span><p style="color:var(--head)">${esc(r.feedback||'')}</p>
            ${(r.cluesHeUsed||[]).length?`<p><b>Clues you caught:</b> ${esc(r.cluesHeUsed.join('; '))}</p>`:''}${(r.cluesHeMissed||[]).length?`<p><b>Clues you missed:</b> ${esc(r.cluesHeMissed.join('; '))}</p>`:''}
            <p class="muted"><b>Most likely:</b> ${esc(sc.a)}</p></div>`;
          el.querySelector('.lfoot .in').innerHTML='<button class="btn c block" id="nx">Next situation</button>';el.querySelector('#nx').onclick=next;
          el.querySelector('#out').scrollIntoView({behavior:'smooth',block:'start'});
        }catch(x){showAiError(st,x)}finally{if(e.target.isConnected)unbusy(e.target)}};
    };next();
  });
}

let JD=null,JDP=null;
function loadJD(){if(JD)return Promise.resolve(JD);if(!JDP)JDP=fetch('jdict.json').then(r=>{if(!r.ok)throw new Error('jd');return r.json()}).then(d=>{JD=d;return d}).catch(e=>{JDP=null;throw e});return JDP}
/* romaji → hiragana, so "neko" finds ねこ */
const R2K=(()=>{const m={};Object.entries(KBASE).forEach(([k,r])=>{if(!m[r])m[r]=k});
  Object.assign(m,{si:'し',ti:'ち',tu:'つ',hu:'ふ',zi:'じ',di:'ぢ',du:'づ',wo:'を',nn:'ん',ja:'じゃ',ju:'じゅ',jo:'じょ',je:'じぇ'});
  for(const[c,b]of[['ky','き'],['gy','ぎ'],['sh','し'],['ch','ち'],['ny','に'],['hy','ひ'],['by','び'],['py','ぴ'],['my','み'],['ry','り'],['j','じ'],['sy','し'],['ty','ち'],['zy','じ']])for(const[v,s]of[['a','ゃ'],['u','ゅ'],['o','ょ']])if(!m[c+v])m[c+v]=b+s;
  return m})();
function toKana(r){r=String(r).toLowerCase().replace(/[āâ]/g,'aa').replace(/[ūû]/g,'uu').replace(/[ōô]/g,'ou').replace(/[^a-z\-]/g,'');let out='',i=0;
  while(i<r.length){if(r[i]==='-'){out+='ー';i++;continue}
    if(i+1<r.length&&r[i]===r[i+1]&&!'aeioun'.includes(r[i])){out+='っ';i++;continue}
    if(r[i]==='n'&&(i+1===r.length||!'aeiouy'.includes(r[i+1]))){out+='ん';i+=(r[i+1]==='n'?2:1);continue}
    let hit=false;for(const L of[3,2,1]){const s=r.substr(i,L);if(R2K[s]){out+=R2K[s];i+=L;hit=true;break}}if(!hit)return null}
  return out}
const JLV={5:'N5',4:'N4',3:'N3',2:'N2',1:'N1'};
const kataToHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function jdSearch(q,limit=60){
  q=q.trim();if(!q)return[];const out=[];
  if(/[぀-ヿ一-龯]/.test(q)){const h=kataToHira(q);
    for(const e of JD){if(e[0].startsWith(q)||kataToHira(e[1]).startsWith(h))out.push(e);if(out.length>=limit)break}return out}
  const ql=q.toLowerCase(),kana=toKana(ql);const re=new RegExp('(^|[;(\\s])(to )?'+ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\b|$)','i');
  const exact=[],word=[],read=[];
  for(const e of JD){const first=e[2].split('; ')[0].toLowerCase().replace(/^to /,'').replace(/ \(.*\)$/,'');
    if(first===ql)exact.push(e);else if(re.test(e[2]))word.push(e);else if(kana&&kataToHira(e[1]).startsWith(kana))read.push(e)}
  return[...exact,...word,...read].slice(0,limit);
}
function jdRow(e,i){return`<button class="li term jd" data-i="${i}"><div style="min-width:0;text-align:left"><span class="jp-ruby" lang="ja" style="font-size:1.35rem;line-height:1.9">${rubyChunks([{k:e[1]}])}</span>${e[0]?`<span class="s" lang="ja" style="font-size:1rem;color:var(--head)">${esc(e[0])}</span>`:''}<span class="s">${esc(e[2])}</span></div>${e[4]?`<span class="r">${JLV[e[4]]}</span>`:'<span></span>'}</button>`}
function openJDict(prefill){
  push('jp',el=>{
    let q=prefill||'',mode='5',shown=80,list=[];
    page(el,'Japanese dictionary',`<div class="hero">${bi('book',{s:76})}<h2>Japanese dictionary</h2><p class="status"><span class="spin" style="border-color:var(--line);border-top-color:var(--red)"></span>Opening</p></div>`);
    loadJD().then(draw).catch(()=>{if(el.isConnected)page(el,'Japanese dictionary',`<div class="hero"><h2>Japanese dictionary</h2><p class="status err">Couldn't load the dictionary. Check your connection and open it again.</p></div>`)});
    function compute(){
      if(q)return jdSearch(q,200);
      if(mode==='read'){const can=new Set(LESSONS.filter(l=>PDONE.includes(l.id)&&l.newChars).flatMap(l=>l.newChars));return JD.filter(e=>!e[0]&&[...e[1]].every(ch=>can.has(ch)||'ゃゅょっ'.includes(ch))&&e[4]>=4).slice(0,400)}
      return JD.filter(e=>e[4]===+mode)}
    function draw(){if(!el.isConnected)return;list=compute();const vis=list.slice(0,shown);
      const lin=page(el,'Japanese dictionary',`<div class="hero"><h2>Japanese dictionary</h2><p>${JD.length.toLocaleString()} words. Search in English, Japanese or romaji (like "neko").</p></div>
        <input class="search" id="q" placeholder="cat, ねこ, neko…" value="${esc(q)}" autocomplete="off" autocapitalize="off">
        ${q?'':seg('md',[{v:'read',l:'Words I can read'},{v:'5',l:'Beginner (N5)'},{v:'4',l:'N4'},{v:'3',l:'N3'},{v:'2',l:'N2'},{v:'1',l:'N1'}],mode)}
        ${!q&&mode==='read'&&!list.length?'<p class="empty">Finish a few hiragana lessons and the words you can read will show up here.</p>':''}
        <div class="list">${vis.map((e,i)=>jdRow(e,i)).join('')||(q?'<p class="empty">No matches. Try another spelling.</p>':'')}</div>
        ${list.length>shown?`<button class="btn block" id="more">Show more</button>`:''}
        <p class="muted small">Dictionary data from JMdict by the Electronic Dictionary Research and Development Group, used under the CC BY-SA 4.0 license. JLPT levels are approximate.</p>`);
      const qi=el.querySelector('#q');let t;qi.oninput=e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value.trim();shown=80;const p=qi.selectionStart;draw();const n=el.querySelector('#q');n.focus();n.setSelectionRange(p,p)},180)};
      bindSeg(el,'md',v=>{mode=v;shown=80;draw()});
      const m=el.querySelector('#more');if(m)m.onclick=()=>{shown+=150;draw()};
      lin.onclick=e=>{const b=e.target.closest('.jd');if(b)jdEntry(list[+b.dataset.i])};
    }
  });
}
function jdEntry(e){
  push('jp',el=>{
    const [w,r,m,pos,lv]=e;const means=m.split('; ');
    page(el,'Japanese dictionary',`<div class="hero" style="justify-items:center;text-align:center"><div class="jp-ruby" lang="ja" style="font-size:2.6rem">${rubyChunks([{k:r}])}</div>${w?`<div class="jp-big" lang="ja" style="font-size:2rem">${esc(w)}</div>`:''}<div class="jp-romaji">${esc(romaOf(kataToHira(r)))}</div>
      <div style="display:flex;gap:8px;justify-content:center">${pos?`<span class="tag">${esc(pos)}</span>`:''}${lv?`<span class="tag">JLPT ${JLV[lv]}</span>`:''}</div>${sayBtn(r)}</div>
      <div class="card">${means.map((x,i)=>`<p style="color:var(--head);font-size:1.1rem"><b>${i+1}.</b> ${esc(x)}</p>`).join('')}</div>`,
      '<button class="btn" id="ex">Use it in a sentence</button><button class="btn c" id="sv">Save</button>');
    el.querySelector('#sv').onclick=ev=>saveJp({en:means[0],ja:w||r,kana:kataToHira(r),romaji:romaOf(kataToHira(r))},ev.target);
    el.querySelector('#ex').onclick=()=>openTutor(`How do I use the Japanese word ${w||r} (${r}, "${means[0]}") in everyday conversation? Give me 3 short example sentences a high schooler would actually say, each with hiragana, romaji and English.`);

  });

const SAYK=s=>'say:'+norm(s[0]);
const SAYKB=s=>({k:SAYK(s),t:`"${s[0]}" means ${s[1].charAt(0).toLowerCase()+s[1].slice(1)}`,c:'Sayings',i:''});
const sayOfDay=()=>SAYINGS[(dayIndex()*7)%SAYINGS.length];
/* fill-the-blank: hide the last meaningful word */
function sayBlank(s){const w=s[0].split(' ');const skip=/^(the|a|an|of|to|in|on|it|you|your|is|and|but|with|by|for|its|can't|don't|one)$/i;
  for(let i=w.length-1;i>0;i--){const clean=w[i].replace(/[^A-Za-z']/g,'');if(clean.length>2&&!skip.test(clean)){return{shown:w.map((x,j)=>j===i?'_____':x).join(' '),a:clean.toLowerCase()}}}return null}
function sayingItems(src,n=10){
  const meanings=SAYINGS.map(s=>s[1]);
  return prioritize(src.map(s=>{
    const b=sayBlank(s);const r=Math.random();
    if(b&&r<.34){const pool=SAYINGS.map(x=>sayBlank(x)).filter(Boolean).map(x=>x.a);
      return{...mkItem(SAYK(s),'Finish the saying',`<span class="bigdef">${esc(b.shown)}</span>`,b.a,[b.a],pool,`${s[0]}: ${s[1]}`),kb:SAYKB(s),missText:s[0]}}
    if(r<.67)return{...mkItem(SAYK(s),'Which saying means…',`<span class="bigdef">${esc(s[1])}</span>`,s[0],[s[0]],SAYINGS.map(x=>x[0]),s[3]),kb:SAYKB(s),missText:s[0]}
    return{...mkItem(SAYK(s),'What does this mean?',`<span class="bigdef">"${esc(s[0])}"</span>`,s[1],[s[1]],meanings,`${s[3]} Origin: ${s[2]}`),kb:SAYKB(s),missText:s[1]}
  }),n)}
function sayingsQuiz(src){src=src||SAYINGS;lesson({theme:'words',items:sayingItems(src,10),again:()=>sayingsQuiz(src)});markDone('sayings')}
function sayCard(s,i){const known=!!KB[SAYK(s)];return`<button class="li term sayrow" data-i="${i}"><div style="min-width:0;text-align:left"><b style="color:var(--head)">${esc(s[0])}</b><span class="s">${esc(s[1])}</span></div>${known?`<span class="r" style="color:var(--green)">${ICON.check}</span>`:'<span></span>'}</button>`}
function openSayings(){
  push('words',el=>{let q='',g='all';
    const draw=()=>{const ql=norm(q);const list=SAYINGS.map((s,i)=>[s,i]).filter(([s])=>(g==='all'||s[4]===g)&&(!ql||norm(s[0]+' '+s[1]).includes(ql)));
      const known=SAYINGS.filter(s=>KB[SAYK(s)]).length;const d=sayOfDay();
      const lin=page(el,'Old sayings',`<div class="hero">${bi('speech',{s:76})}<h2>Old sayings</h2><p>${SAYINGS.length} idioms and proverbs people use without explaining. You know ${known}.</p></div>
        <div class="card t-words sayday"><span class="eyebrow">Saying of the day</span><div class="w">${esc(d[0])}</div><p>${esc(d[1])}</p><p class="muted"><i>${esc(d[3])}</i></p></div>
        <input class="search" id="q" placeholder="Search sayings" value="${esc(q)}" autocomplete="off">
        ${seg('sg',[{v:'all',l:'All'},{v:'i',l:'Idioms'},{v:'p',l:'Proverbs'}],g)}
        <div class="list">${list.map(([s,i])=>sayCard(s,i)).join('')||'<p class="empty">No matches.</p>'}</div>`,
        `<button class="btn c block" id="qz">Quiz me</button>`);
      const qi=el.querySelector('#q');let t;qi.oninput=e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value;const p=qi.selectionStart;draw();const n=el.querySelector('#q');n.focus();n.setSelectionRange(p,p)},180)};
      bindSeg(el,'sg',v=>{g=v;draw()});
      el.querySelector('#qz').onclick=()=>sayingsQuiz(g==='all'?SAYINGS:SAYINGS.filter(s=>s[4]===g));
      lin.onclick=e=>{const b=e.target.closest('.sayrow');if(b)sayEntry(SAYINGS[+b.dataset.i],draw)};
    };draw();
  });
}
function sayEntry(s,back){
  push('words',el=>{
    page(el,'Old sayings',`<div class="hero" style="text-align:center;justify-items:center">${bi('speech',{s:64})}<h2 style="font-size:1.6rem">"${esc(s[0])}"</h2><span class="tag">${s[4]==='p'?'Proverb':'Idiom'}</span></div>
      <div class="card"><span class="eyebrow">What it means</span><p style="font-size:1.15rem;color:var(--head)">${esc(s[1])}</p></div>
      <div class="card"><span class="eyebrow">How you'd say it</span><p><i>${esc(s[3])}</i></p></div>
      <div class="card"><span class="eyebrow">Where it comes from</span><p>${esc(s[2])}</p></div>`,
      `<button class="btn" id="sv">Save</button><button class="btn c" id="ok">Got it</button>`);
    el.querySelector('#ok').onclick=()=>{addKnowledge(SAYKB(s));tone(true);pop()};
    el.querySelector('#sv').onclick=e=>saveWord({word:s[0],partOfSpeech:'saying',meaning:s[1],example:s[3]},e.target);
  });
}

/* ================= History ================= */
const yr=y=>y<0?`${-y} BCE`:String(y);
const ERAS=[{id:'anc',t:'Ancient world',d:'Before 500 CE',a:-1e4,b:500},{id:'med',t:'Middle Ages',d:'500 to 1450',a:500,b:1450},{id:'early',t:'Exploration and Renaissance',d:'1450 to 1750',a:1450,b:1750},{id:'rev',t:'Revolutions and industry',d:'1750 to 1914',a:1750,b:1914},{id:'ww',t:'The World Wars',d:'1914 to 1945',a:1914,b:1946},{id:'mod',t:'Modern world',d:'1946 to today',a:1946,b:3000}];
const eraOf=y=>ERAS.find(e=>y>=e.a&&y<e.b);
const hkb=h=>({k:'hist:'+h[1],t:`${h[1]} (${yr(h[0])})`,d:h[3],c:'History',i:''});
const PORD=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
function yearChoices(y){
  const spread=y<0?400:y<1450?120:y<1800?40:y<1900?20:8;const set=new Set([y]);let guard=0;
  while(set.size<4&&guard++<200){let o=Math.round((Math.random()*2-1)*spread);if(Math.abs(o)<Math.max(2,spread/6))continue;let c=y+o;if(y<1800&&y>0)c=Math.round(c/ (spread>=40?5:1))*(spread>=40?5:1);if(c>2025||(y>0&&c<=0)||(y<0&&c>=0)||c===y)continue;set.add(c)}
  return shuffle([...set].map(yr))}
function histWhen(h){return{type:'mc',key:'hw:'+h[1],prompt:'When did this happen?',big:`<span class="bigdef">${esc(h[1])}</span>`,a:yr(h[0]),choices:yearChoices(h[0]),extra:h[3],kb:hkb(h),missText:`${h[1]}: ${yr(h[0])}`}}
function histFirst(a,b){const[e,l]=a[0]<b[0]?[a,b]:[b,a];return{type:'mc',key:'hf:'+e[1]+'|'+l[1],prompt:'Which came first?',big:'',a:e[1],choices:shuffle([a[1],b[1]]),extra:`${e[1]}: ${yr(e[0])}. ${l[1]}: ${yr(l[0])}.`,kb:hkb(e),missText:e[1]}}
function histWho(p){return{type:'mc',key:'hp:'+p[0],prompt:'Who was this?',big:`<span class="bigdef">${esc(p[1])}</span><br><span class="muted small">${esc(p[2])}</span>`,a:p[0],choices:shuffle([p[0],...shuffle(HPEOPLE.filter(x=>x[0]!==p[0]&&x[3]===p[3])).slice(0,3).map(x=>x[0])]),kb:{k:'who:'+p[0],t:`${p[0]}: ${p[1]}`,c:'History',i:''},missText:p[0]}}
function presItem(i){const p=PRES[i],n=i+1;const others=()=>shuffle([...new Set(PRES.map(x=>x[0]).filter(x=>x!==p[0]))]);
  const r=Math.random();const kb={k:'pres:'+n,t:`${p[0]} was the ${PORD(n)} president (${p[1]}${p[2]?'–'+p[2]:' to now'})`,c:'History',i:''};
  if(r<.4){const near=[...new Set(PRES.slice(Math.max(0,i-6),i+7).map(x=>x[0]).filter(x=>x!==p[0]))];return{type:'mc',key:'pn:'+n,prompt:`Who was the ${PORD(n)} president?`,big:`<span class="bigdef">${p[1]}${p[2]?' to '+p[2]:' to now'}</span>`,a:p[0],choices:shuffle([p[0],...shuffle(near).slice(0,3)]),extra:p[4],kb,missText:p[0]}}
  if(r<.7&&i>0){const prev=PRES[i-1];const near=[...new Set(PRES.slice(Math.max(0,i-5),i+6).map(x=>x[0]).filter(x=>x!==p[0]&&x!==prev[0]))];return{type:'mc',key:'pa:'+n,prompt:`Who came right after ${prev[0]}?`,big:'',a:p[0],choices:shuffle([p[0],...shuffle(near).slice(0,3)]),extra:`${p[0]}, ${p[1]}${p[2]?' to '+p[2]:' to now'}. ${p[4]}`,kb,missText:p[0]}}
  return{type:'mc',key:'pf:'+n,prompt:'Which president?',big:`<span class="bigdef">${esc(p[4])}</span>`,a:p[0],choices:shuffle([p[0],...others().slice(0,3)]),extra:`The ${PORD(n)} president, ${p[1]}${p[2]?' to '+p[2]:' to now'}.`,kb,missText:p[0]}}
function histQuiz(kind,filt){
  const pool=HIST.filter(h=>(!filt||!filt.r||h[2]===filt.r)&&(!filt||!filt.era||eraOf(h[0]).id===filt.era));let items=[];
  if(kind==='when')items=prioritize(pool.map(histWhen),10);
  else if(kind==='first'){for(let k=0;k<30;k++){const a=pick(pool),b=pick(pool);if(a[0]!==b[0])items.push(histFirst(a,b))}items=items.slice(0,10)}
  else if(kind==='who')items=prioritize(HPEOPLE.filter(p=>!filt||!filt.r||p[3]===filt.r).map(histWho),10);
  else if(kind==='pres')items=prioritize(PRES.map((_,i)=>presItem(i)),10);
  else if(kind==='mix'){items=shuffle([...prioritize(pool.map(histWhen),4),...prioritize(HPEOPLE.map(histWho),3),...(()=>{const o=[];for(let k=0;k<3;k++){const a=pick(pool),b=pick(pool);if(a[0]!==b[0])o.push(histFirst(a,b))}return o})()])}
  if(kind!=='pres'&&kind!=='who'&&pool.length>=4){const pp=shuffle(pool).filter((h,i,a)=>a.findIndex(x=>x[0]===h[0])===i).slice(0,4);items.splice(Math.min(5,items.length),0,{type:'pairs',key:'hm:'+pp.map(x=>x[1]).join('|'),prompt:'Match each event to its year',pairs:pp.map(h=>[esc(h[1]),esc(yr(h[0]))]),a:''})}

}
function openHistory(){

function openEra(id){const E=ERAS.find(e=>e.id===id);
  push('world',el=>{let r='all';
    const draw=()=>{const ev=HIST.filter(h=>eraOf(h[0])===E&&(r==='all'||h[2]===r));
      page(el,E.t,`<div class="hero"><h2>${esc(E.t)}</h2><p>${esc(E.d)}. Tap an event to add it to your knowledge book.</p></div>
        ${seg('rg',[{v:'all',l:'All'},{v:'W',l:'World'},{v:'US',l:'United States'}],r)}
        <div class="tline-list">${ev.map(h=>`<button class="tev${KB['hist:'+h[1]]?' known':''}" data-t="${esc(h[1])}"><span class="ty">${esc(yr(h[0]))}</span><span class="tb"><b>${esc(h[1])}</b><span>${esc(h[3])}</span></span></button>`).join('')||'<p class="empty">Nothing here for this filter.</p>'}</div>`,
        `<button class="btn c block" id="qz" ${ev.length<4?'disabled':''}>Quiz this era</button>`);
      bindSeg(el,'rg',v=>{r=v;draw()});
      el.querySelector('#qz').onclick=()=>histQuiz('mix',{era:id,r:r==='all'?null:r});
      el.querySelector('.tline-list').onclick=e=>{const b=e.target.closest('.tev');if(!b)return;const h=HIST.find(x=>x[1]===b.dataset.t);addKnowledge(hkb(h));b.classList.add('known');tone(true)}};
    draw()});
}
function openPresList(){push('world',el=>{page(el,'Presidents',`<div class="hero"><h2>US presidents</h2><p>Grover Cleveland and Donald Trump each served two terms that weren't back to back, so they show up twice.</p></div>
  <div class="list">${PRES.map((p,i)=>`<div class="li"><span class="pn">${i+1}</span><div style="min-width:0"><b style="color:var(--head)">${esc(p[0])}</b><span class="s">${p[1]}${p[2]?'–'+p[2]:' to now'} · ${esc(p[3])}</span><span class="s">${esc(p[4])}</span></div></div>`).join('')}</div>`,'<button class="btn c block" id="qz">Quiz me</button>');el.querySelector('#qz').onclick=()=>histQuiz('pres')})}
function openPeople(){push('world',el=>{page(el,'People',`<div class="hero"><h2>People in history</h2></div>

const LANG_META={ja:{name:'Japanese',native:'日本語',flag:'jp'},...Object.fromEntries(Object.entries(LANGS).map(([k,v])=>[k,{name:v.name,native:v.gloss==='es'?'Para hispanohablantes':v.native,flag:v.flag}]))};

/* romanization lookup so word tiles can show how to say them */
const LROM={};Object.entries(LANGS).forEach(([c,L])=>{const m={};L.units.forEach(u=>u.words.forEach(w=>{if(w[1])m[w[0]]=w[1]}));LROM[c]=m});
function langLessons(code){const L=LANGS[code];const out=[];L.units.forEach((u,ui)=>{out.push({id:`${code}-${ui}-w`,unit:ui,kind:'words',title:u.title,sub:'Words'});out.push({id:`${code}-${ui}-p`,unit:ui,kind:'phrases',title:u.title,sub:'Phrases'})});return out}
const lpDone=code=>store.get('lpath:'+code,[]);
const lpNext=code=>{const ls=langLessons(code),d=lpDone(code);const n=ls.findIndex(l=>!d.includes(l.id));return n<0?ls.length-1:n};
const lkb=(code,w)=>({k:`lang:${code}:${w[0]}`,t:`${w[0]}${w[1]?` (${w[1]})`:''} means "${w[2]}"`,c:'Languages',i:''});
function langItems(code,li){
  const L=LANGS[code],les=langLessons(code)[li],u=L.units[les.unit],seq=[];
  const base={lang:L.speech,rtl:L.rtl};
  const show=w=>`<span class="lword" lang="${L.speech}"${L.rtl?' dir="rtl"':''}>${esc(w[0])}</span>${w[1]?`<span class="lrom">${esc(w[1])}</span>`:''}`;
  const allWords=L.units.slice(0,les.unit+1).flatMap(x=>x.words);
  const meanMC=w=>({...base,type:'mc',key:`lw:${code}:${w[0]}`,prompt:'What does this mean?',big:show(w),a:w[2],choices:shuffle([w[2],...shuffle([...new Set(allWords.map(x=>x[2]))].filter(x=>x!==w[2])).slice(0,3)]),say:w[0],kb:lkb(code,w),missText:`${w[0]} = ${w[2]}`});
  const pickMC=w=>{const opts=shuffle(allWords.filter(x=>x[2]!==w[2]&&x[0]!==w[0])).slice(0,3);return{...base,type:'mc',key:`lr:${code}:${w[0]}`,prompt:`How do you say "${w[2]}"?`,big:'',a:w[0]+(w[1]?` (${w[1]})`:''),choices:shuffle([w,...opts].map(x=>x[0]+(x[1]?` (${x[1]})`:''))),optLang:L.speech,optRtl:L.rtl,say:w[0],kb:lkb(code,w),missText:`${w[2]} = ${w[0]}`}};
  if(les.kind==='words'){
    const ws=u.words;
    for(let k=0;k<ws.length;k+=3){const grp=ws.slice(k,k+3);grp.forEach(w=>seq.push({...base,type:'card',prompt:'New word',t:w[0],rom:w[1],en:w[2]}));grp.forEach(w=>seq.push(meanMC(w)))}
    const pw=shuffle(ws).slice(0,5);
    seq.push({type:'pairs',key:`lpp:${code}:${les.id}`,prompt:'Tap the matching pairs',pairs:pw.map(w=>[`<span lang="${L.speech}">${esc(w[0])}</span>`,esc(w[2])]),a:''});
    shuffle(ws).slice(0,6).forEach(w=>seq.push(pickMC(w)));
  }else{
    const ps=u.phrases;const others=L.units.flatMap(x=>x.phrases).flatMap(p=>p[3]);
    ps.forEach(p=>{seq.push({...base,type:'card',prompt:'New phrase',t:p[0],rom:p[1],en:p[2]})});
    ps.forEach(p=>{const extra=shuffle([...new Set(others.filter(t=>!p[3].includes(t)))]).slice(0,3);const tiles=shuffle([...p[3],...extra]);
      const tileRom={};if(L.speech!=='es-MX'&&L.speech!=='fr-FR')tiles.forEach(t=>{const r=LROM[code][t.replace(/[？?،,.!！]/g,'')];if(r)tileRom[t]=r});
      seq.push({...base,type:'tiles',key:`lt:${code}:${p[0]}`,prompt:`Write this in ${L.name}`,big:`<span class="bigdef">${esc(p[2])}</span>`,tiles,ans:p[3],a:p[0]+(p[1]?` (${p[1]})`:''),tileRom,say:p[0],kb:lkb(code,p),missText:p[0]})});
    shuffle(ps).slice(0,2).forEach(p=>seq.push({...base,type:'mc',key:`lpm:${code}:${p[0]}`,prompt:'What does this mean?',big:show(p),a:p[2],choices:shuffle([p[2],...shuffle(L.units.flatMap(x=>x.phrases).map(x=>x[2]).filter(x=>x!==p[2])).slice(0,3)]),say:p[0],kb:lkb(code,p)}));
    shuffle(u.words).slice(0,3).forEach(w=>seq.push(meanMC(w)));
  }
  return seq;
}

      <p class="note">${esc(u.tip)}</p>
      <div>${list.map(w=>`<div class="iw"><span class="jp" lang="${L.speech}"${L.rtl?' dir="rtl"':''}>${esc(w[0])}${w[1]?`<small class="lrom">${esc(w[1])}</small>`:''}</span><span class="en">${esc(w[2])}</span>${sayBtn(w[0],L.speech)}</div>`).join('')}</div>`,

}

  [['lt-tr',()=>openLangTranslate(code)],['lt-pb',()=>openPhrasebook(code)],['lt-rv',()=>langReview(code)],['lt-nt',()=>openLangNotes(code)]].forEach(([k,f])=>ACT[k]=f);
  const tools=`<div class="jtools">${[['lt-tr','pencil','Translate'],['lt-pb','book','Phrasebook'],['lt-rv','sparkle','Review'],['lt-nt','notebook','My sentences']].map(([id,ic,t])=>`<button class="mini" data-act="${id}">${bi(ic,{s:52})}<b>${t}</b></button>`).join('')}</div>`;
  const path=ls.map((l,i)=>{let ban='';if(l.unit!==last){last=l.unit;ban=`${i?'</div>':''}<div class="banner"${i?' style="margin-top:14px"':''}><small>Unit ${l.unit+1}</small><b>${esc(utitle(L.units[l.unit]))}</b><span>${esc(L.units[l.unit].words.slice(0,3).map(w=>w[0]).join(', '))}…</span></div><div class="path">`}
    const done=d.includes(l.id),isNext=i===nu&&!done;ACT['lu'+i]=()=>openLangLesson(code,i);
    return`${ban}<button class="node${done?' done':''}${isNext?' next':''}${l.kind==='phrases'?' wordsnode':''}" data-act="lu${i}" style="transform:translateX(${offs[i%8]}px)">${isNext?'<span class="bubble">START</span>':''}<span class="disc">${done?ICON.check:l.kind==='words'?String(l.unit+1):`<svg viewBox="0 0 24 24" style="width:44%;height:44%">${IC.speech}</svg>`}</span><span class="lbl">${esc(l.sub)}</span></button>`}).join('')+'</div>';
  return tools+path;
}

punct:[
["Which sentence is punctuated correctly?","After the game ended, we went out for pizza.",["After the game ended we, went out for pizza.","After, the game ended we went out for pizza.","After the game ended; we went out for pizza."],"Put a comma after an introductory clause, not inside it, and don't use a semicolon there."],
["Which sentence is punctuated correctly?","Before leaving for school, Maya checked her backpack.",["Before leaving for school Maya, checked her backpack.","Before leaving, for school Maya checked her backpack.","Before leaving for school; Maya checked her backpack."],"The comma goes right after the whole introductory phrase."],
["Which sentence is punctuated correctly?","However, the test was easier than we expected.",["However the test, was easier than we expected.","However; the test was easier than we expected.","However the test was easier, than we expected."],"Put a comma after an introductory word like however."],
["Which sentence is punctuated correctly?","Yes, I finished the reading.",["Yes I, finished the reading.","Yes; I finished the reading.","Yes I finished, the reading."],"Put a comma after an introductory word like yes or no."],
["Which sentence is punctuated correctly?","I studied for hours, but I still felt nervous.",["I studied for hours but, I still felt nervous.","I studied, for hours but I still felt nervous.","I studied for hours, but, I still felt nervous."],"In a compound sentence, the comma goes before the joining word (FANBOYS), not after it."],
["Which sentence is punctuated correctly?","We can watch a movie, or we can play a board game.",["We can watch a movie or, we can play a board game.","We can watch, a movie or we can play a board game.","We can watch a movie; or, we can play a board game."],"Put a comma before or when it joins two complete sentences."],
["Which sentence is punctuated correctly?","It started to rain, so we went inside.",["It started to rain so, we went inside.","It started, to rain so we went inside.","It started to rain; so, we went inside."],"Put a comma before so when it joins two complete sentences."],

["What part of speech is the CAPITALIZED word?","I wanted pizza, BUT the shop was closed.","conjunction",["preposition","adverb","interjection"],"But joins two complete sentences, so it's a conjunction."],
["What part of speech is the CAPITALIZED word?","WOW, that was an amazing catch!","interjection",["adjective","adverb","noun"],"Wow shows sudden feeling and stands apart from the sentence."],
["What part of speech is the CAPITALIZED word?","Marcus gave HER the notebook.","pronoun",["noun","adjective","preposition"],"Her takes the place of a person's name."],
["What part of speech is the CAPITALIZED word?","The ORCHESTRA practiced every day.","noun",["verb","adjective","pronoun"],"Orchestra names a group of people, so it's a noun."],
["What part of speech is the CAPITALIZED word?","The birds SING every morning.","verb",["noun","adverb","adjective"],"Sing is the action the birds do."],
["What part of speech is the CAPITALIZED word?","HAPPINESS is contagious.","noun",["adjective","verb","adverb"],"Happiness names a feeling. Ideas and feelings can be nouns."],
["What part of speech is the CAPITALIZED word?","She is VERY talented.","adverb",["adjective","noun","pronoun"],"Very modifies the adjective talented. Words that modify adjectives are adverbs."],
["What part of speech is the CAPITALIZED word?","THEY finished the race together.","pronoun",["noun","adjective","conjunction"],"They takes the place of the names of people."],
["What part of speech is the CAPITALIZED word?","He felt nervous BEFORE the test.","preposition",["conjunction","adverb","adjective"],"Before is followed by a noun (the test), so here it's a preposition."],
["What part of speech is the CAPITALIZED word?","We waited UNTIL the rain stopped.","conjunction",["preposition","verb","interjection"],"Until is followed by a clause with a subject and verb (the rain stopped), so here it's a conjunction."],

["Choose the verb that correctly completes the sentence.","Either the teacher or the students ___ going to lead the discussion.","are",["is","was","has been"],"With either/or, the verb agrees with the closer subject, students."],
["Choose the verb that correctly completes the sentence.","One of the books ___ missing.","is",["are","were","have been"],"The subject is one, which is singular."],
["Choose the verb that correctly completes the sentence.","There ___ three dogs in the yard.","are",["is","was","has been"],"In a sentence starting with there, the subject comes after the verb. Dogs is plural."],

lit:[
["theme","The central message or big idea about life that a story explores.","Many stories share the theme that true friendship requires sacrifice."],
["tone","The author's attitude toward the subject, shown through word choice.","A tone can be playful, serious, sarcastic, or hopeful."],
["mood","The feeling a piece of writing creates in the reader.","A creaky house on a stormy night creates a spooky mood."],
["plot","The sequence of events that make up a story.","Plot usually moves through exposition, rising action, climax, falling action, and resolution."],
["exposition","The beginning of a story, where characters, setting, and background are introduced.","The first chapter that introduces the hero and her town."],
["rising action","The series of events that build tension and lead to the climax.","The clues piling up as a detective gets closer to the truth."],
["climax","The turning point of a story, where tension is highest.","The final showdown between the hero and the villain."],
["falling action","The events after the climax that start to wrap up the story.","The characters dealing with what happened after the big battle."],
["resolution","The end of a story, where the conflict is settled.","The friends make up and the story closes."],
["conflict","The struggle between opposing forces that drives a story.","A character fighting a storm, a rival, or their own fears."],
["internal conflict","A struggle inside a character's own mind.","A student torn between telling the truth and protecting a friend."],
["external conflict","A struggle between a character and an outside force, like another person, nature, or society.","A sailor fighting to survive a hurricane."],
["protagonist","The main character of a story, often the one we root for.","Harry Potter is the protagonist of his series."],
["antagonist","The character or force that works against the protagonist.","The wolf is the antagonist in Little Red Riding Hood."],
["foil","A character whose contrasting traits highlight the traits of another character.","Calm, careful Benvolio is a foil to hot-headed Tybalt in Romeo and Juliet."],
["dynamic character","A character who changes in an important way over the course of the story.","Ebenezer Scrooge goes from greedy to generous in A Christmas Carol."],
["static character","A character who stays basically the same throughout the story.","A loyal sidekick who acts the same from start to finish."],
["characterization","The ways an author reveals what a character is like.","Showing a character through their words, actions, thoughts, looks, and how others react to them."],
["first-person point of view","A story told by a narrator who is a character and uses I or we.","I walked into the room and froze."],
["third-person limited point of view","A story told by an outside narrator who shares the thoughts of only one character.","She wondered if anyone had noticed her mistake."],
["third-person omniscient point of view","A story told by an outside narrator who knows the thoughts and feelings of all the characters.","The narrator tells us what both the hero and the villain are secretly planning."],
["narrator","The voice that tells the story.","Nick Carraway is the narrator of The Great Gatsby."],
["unreliable narrator","A narrator whose account can't be fully trusted.","The narrator of The Tell-Tale Heart insists he is sane while describing a murder."],
["setting","The time and place in which a story happens.","A small town in Alabama in the 1930s is the setting of To Kill a Mockingbird."],
["symbolism","Using an object, person, or event to stand for a bigger idea.","A dove often symbolizes peace."],
["motif","A repeated image, idea, or detail that helps develop a theme.","Repeated images of blood in Macbeth point to guilt."],
["foreshadowing","Hints or clues about what will happen later in a story.","Dark clouds gathering before something bad happens."],
["flashback","A scene that interrupts the story to show something that happened earlier.","A character suddenly remembers a day from her childhood."],
["verbal irony","When a speaker says the opposite of what they really mean.","Saying 'What lovely weather!' during a downpour."],
["situational irony","When what happens is the opposite of what was expected.","A fire station burns down."],
["dramatic irony","When the audience knows something the characters do not.","In Romeo and Juliet, the audience knows Juliet is not really dead, but Romeo doesn't."],
["allusion","A brief reference to a well-known person, place, event, or work.","Calling someone 'a real Romeo' alludes to Shakespeare."],
["imagery","Descriptive language that appeals to the five senses.","The sharp smell of smoke and the crackle of burning logs."],
["diction","An author's choice of words.","Choosing 'stroll' instead of 'walk' changes the feel of a sentence."],
["syntax","The way words and sentences are arranged.","Short, choppy sentences can create a feeling of tension."],
["connotation","The feelings or ideas a word suggests beyond its dictionary meaning.","'Childlike' sounds positive, while 'childish' sounds negative."],
["denotation","The literal, dictionary meaning of a word.","The denotation of 'home' is the place where someone lives."],
["archetype","A character type, symbol, or pattern that appears again and again across stories.","The wise old mentor, like Merlin or Gandalf."],
["allegory","A story in which characters and events stand for bigger ideas, often moral or political.","Animal Farm uses farm animals to represent the Russian Revolution."],
["satire","Writing that uses humor, exaggeration, or irony to criticize people or society.","A comedy sketch that mocks politicians to make a point."],
["soliloquy","A speech in which a character alone on stage speaks their thoughts aloud.","Hamlet's 'To be, or not to be' speech."],
["monologue","A long speech by one character to other characters or the audience.","A king giving a long speech to rally his troops."],
["aside","A short remark a character makes to the audience that other characters on stage don't hear.","A character turns and quietly tells the audience what they really think."],
["tragedy","A drama in which the main character suffers a downfall, often because of a personal flaw.","Romeo and Juliet and Macbeth are tragedies."],
["tragic flaw","A character trait that leads to the hero's downfall.","Macbeth's ambition is his tragic flaw."],
["iambic pentameter","A line of poetry with five iambs, each an unstressed syllable followed by a stressed one, for ten syllables in all.","Shakespeare's sonnets and much of his plays are written in iambic pentameter."],
["stanza","A group of lines in a poem, like a paragraph in prose.","A poem made of four stanzas of four lines each."],
["sonnet","A 14-line poem, usually written in iambic pentameter with a set rhyme scheme.","Shakespeare wrote 154 sonnets."],
["ethos","An appeal to credibility or trust in the speaker.","As a doctor for 20 years, I can tell you this works."],
["pathos","An appeal to the audience's emotions.","An ad showing a lonely shelter puppy to get you to donate."],
["logos","An appeal to logic, facts, and reasoning.","Studies show that students who sleep 8 hours score higher on tests."],
["thesis","The main argument or central point of an essay, usually stated in the introduction.","The last sentence of an intro paragraph often states the thesis."],
["claim","A statement that something is true, which the writer supports with evidence.","Schools should start later because teens need more sleep."],
["counterclaim","An opposing argument that a writer acknowledges and then responds to.","Some say later start times hurt after-school sports, but schedules can be adjusted."],
["rhetorical question","A question asked for effect, not to get an answer.","Who doesn't want to be happy?"]
],

const ELA_KINDS={
  confused:{t:'Mixed-up words',d:'your/you\'re, affect/effect, then/than',ic:'aa'},
  spelling:{t:'Spelling',d:'Words everyone misspells',ic:'pencil'},
  punct:{t:'Punctuation',d:'Commas, apostrophes, semicolons',ic:'dots'},
  grammar:{t:'Grammar',d:'Parts of speech, agreement, run-ons',ic:'book'},
  lit:{t:'Literary terms',d:'Theme, irony, foreshadowing and more',ic:'bookmark'},
  figur:{t:'Figurative language',d:'Simile, metaphor, hyperbole…',ic:'sparkle'}
};
const ekb=(k,t)=>({k:'ela:'+k,t,c:'Grammar',i:''});
function elaItems(kind){
  const E=ELA[kind];
  if(kind==='confused')return E.map(c=>({type:'mc',key:'ec:'+c[0],prompt:'Which word fits?',big:`<span class="bigdef">${esc(c[0]).replace('___','<u class="blank">&nbsp;?&nbsp;</u>')}</span>`,a:c[1],choices:shuffle([c[1],...c[2]]),extra:c[3],kb:ekb('c:'+c[1],`${c[1]}: ${c[3]}`),missText:c[1]}));
  if(kind==='spelling')return E.map(s=>({type:'mc',key:'es:'+s[0],prompt:'Which spelling is right?',big:'',a:s[0],choices:shuffle([s[0],...s[1].slice(0,3)]),extra:s[2]||'',kb:ekb('s:'+s[0],`It's spelled "${s[0]}"`),missText:s[0]}));
  if(kind==='punct')return E.map(p=>({type:'mc',key:'ep:'+p[1],prompt:p[0],big:'',a:p[1],choices:shuffle([p[1],...p[2]]),extra:p[3],kb:ekb('p:'+p[1],p[3]),missText:p[1]}));
  if(kind==='grammar')return E.map(g=>({type:'mc',key:'eg:'+g[0]+g[1],prompt:g[0],big:g[1]?`<span class="bigdef">${esc(g[1]).replace(/\b([A-Z]{2,}(?:\s[A-Z]{2,})*)\b/g,'<mark class="cap">$1</mark>').replace('___','<u class="blank">&nbsp;?&nbsp;</u>')}</span>`:'',a:g[2],choices:shuffle([g[2],...g[3]]),extra:g[4],kb:ekb('g:'+g[0]+g[1],g[4]),missText:g[2]}));
  if(kind==='lit')return E.map(l=>Math.random()<.55
    ?{type:'mc',key:'el:'+l[0],prompt:'Which term is this?',big:`<span class="bigdef">${esc(l[1])}</span>`,a:l[0],choices:shuffle([l[0],...shuffle(E.filter(x=>x[0]!==l[0])).slice(0,3).map(x=>x[0])]),extra:l[2],kb:ekb('l:'+l[0],`${l[0]}: ${l[1]}`),missText:l[0]}
    :{type:'mc',key:'el:'+l[0],prompt:`What is ${/^[aeiou]/i.test(l[0])?'an':'a'} ${l[0].toLowerCase()}?`,big:'',a:l[1],choices:shuffle([l[1],...shuffle(E.filter(x=>x[0]!==l[0])).slice(0,3).map(x=>x[1])]),extra:l[2],kb:ekb('l:'+l[0],`${l[0]}: ${l[1]}`),missText:l[0]});
  if(kind==='figur'){const devs=[...new Set(E.map(f=>f[1]))];return E.map(f=>({type:'mc',key:'ef:'+f[0],prompt:'What kind of figurative language is this?',big:`<span class="bigdef">"${esc(f[0])}"</span>`,a:f[1],choices:shuffle([f[1],...shuffle(devs.filter(d=>d!==f[1])).slice(0,3)]),extra:f[2],kb:ekb('f:'+f[1],`${f[1]}: ${f[2]}`),missText:f[1]}))}
  return[];
}
function elaQuiz(kind){
  const items=kind==='mix'?shuffle(Object.keys(ELA_KINDS).flatMap(k=>prioritize(elaItems(k),2))):prioritize(elaItems(kind),10);
  lesson({theme:'words',items,onFinish:()=>markDone('english'),again:()=>elaQuiz(kind)});
}
function openEnglish(){
  push('words',el=>{
    const known=Object.keys(KB).filter(k=>k.startsWith('ela:')).length;
    page(el,'English class',`<div class="hero">${bi('aa',{s:76})}<h2>English class</h2><p>Grammar, the words everyone mixes up, punctuation, and the literary terms your teacher expects you to know.${known?` You've got ${known} down.`:''}</p></div>
      <button class="fcard fill t-words" data-k="mix" style="min-height:0;width:100%">${bi('sparkle',{s:46})}<div><b>Mixed quiz</b><span>A little of everything</span></div><span class="fc-go">Start</span></button>
      <div class="lgrid">${Object.entries(ELA_KINDS).map(([k,v])=>`<button class="lt t-words" data-k="${k}">${bi(v.ic,{s:44})}<b>${esc(v.t)}</b><span class="d">${esc(v.d)} · ${ELA[k].length}</span></button>`).join('')}</div>
      <div class="rows"><button class="rowcard t-words" id="lt">${bi('book',{s:52})}<span><b>Literary terms list</b><span class="d">Every term with a definition and example</span></span>${ICON.chev}</button></div>`);

function openLitTerms(){push('words',el=>{let q='';const draw=()=>{const ql=norm(q);

  <div class="list">${[...ELA.lit].sort((a,b)=>a[0].localeCompare(b[0])).filter(l=>!ql||norm(l.join(' ')).includes(ql)).map(l=>`<button class="li term lterm" data-t="${esc(l[0])}"><div style="min-width:0;text-align:left"><b style="color:var(--head)">${esc(l[0])}</b><span class="s">${esc(l[1])}</span><span class="s"><i>${esc(l[2])}</i></span></div>${KB['ela:l:'+l[0]]?`<span class="r" style="color:var(--green)">${ICON.check}</span>`:'<span></span>'}</button>`).join('')}</div>`,'<button class="btn c block" id="qz">Quiz me</button>');
  const qi=el.querySelector('#q');let t;qi.oninput=e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value;const p=qi.selectionStart;draw();const n=el.querySelector('#q');n.focus();n.setSelectionRange(p,p)},200)};
  el.querySelector('#qz').onclick=()=>elaQuiz('lit');
  lin.onclick=e=>{const b=e.target.closest('.lterm');if(!b)return;const l=ELA.lit.find(x=>x[0]===b.dataset.t);addKnowledge(ekb('l:'+l[0],`${l[0]}: ${l[1]}`));tone(true);b.querySelector('span:last-child').outerHTML=`<span class="r" style="color:var(--green)">${ICON.check}</span>`}};draw()})}
ACT.english=()=>openEnglish();

        <button class="rowcard t-jp" data-act="jnb">${bi('notebook',{s:52})}<span><b>Japanese notebook</b><span class="d">${lists.japanese.length} saved phrases</span></span>${ICON.chev}</button>
      </div>`;
    ACT.terms=()=>openTerms();ACT.book=openBook;ACT.facts=()=>openFacts();ACT.wbank=openWordBank;ACT.jnb=openNotebook;ACT.rights=()=>rightsRead(false);
    $('#ws').onclick=e=>saveWord({word:wd.w,partOfSpeech:wd.pos,meaning:wd.def,example:wd.ex},e.target);
  }else if(TAB==='jp'){
    const ml=myLangs();let cur=store.get('curLang',ml[0]||'ja');if(ml.length&&!ml.includes(cur))cur=ml[0];
    ACT['lang-add']=()=>openOnboarding(true);
    const chips=`<div class="lchips">${ml.map(c=>`<button class="lchip${c===cur?' on':''}" data-lc="${c}">${lflag(c)}<b>${esc(LANG_META[c].name)}</b></button>`).join('')}<button class="lchip add" data-act="lang-add">+ ${ml.length?'Add':'Pick a language'}</button></div>`;
    const bindChips=()=>$$('[data-lc]',V).forEach(b=>b.onclick=()=>{store.set('curLang',b.dataset.lc);render();window.scrollTo({top:0})});
    if(!ml.length){V.innerHTML=`<div class="vhead"><h1>Languages</h1></div><div class="hero">${bi('speech',{s:76,th:'jp'})}<h2>No languages yet</h2><p>Japanese, Spanish, French, Mandarin, Hindi or Arabic. Each has a step-by-step course and a translator.</p></div><button class="btn c block" data-act="lang-add">Pick a language</button>`;return}
    if(cur!=='ja'){V.innerHTML=`<div class="vhead"><h1>${esc(LANG_META[cur].name)}</h1></div>${chips}${langViewHTML(cur)}<div class="spacer"></div>`;bindChips();return}
    const nu=nextUnit();let last='';const offs=[0,44,70,44,0,-44,-70,-44];const UD={Hiragana:['Unit 1','Hiragana','All 46 characters, a couple at a time'],'First phrases':['Unit 2','First phrases','Greetings, food, school, simple sentences']};
    const units=LESSONS.map((L,i)=>{let ban='';const newU=L.unit!==last;if(newU){last=L.unit;const U=UD[L.unit]||['',L.unit,''];ban=`${i?'</div>':''}<div class="banner"${i?' style="margin-top:14px"':''}><small>${U[0]}</small><b>${U[1]}</b><span>${U[2]}</span></div><div class="path">`}
      const done=PDONE.includes(L.id),isNext=i===nu&&!done;const g=done?ICON.check:esc(L.label);
      ACT['u'+i]=()=>unitIntro(i);
      return `${ban}<button class="node${done?' done':''}${isNext?' next':''}${L.kind==='words'?' wordsnode':''}" data-act="u${i}" style="transform:translateX(${offs[i%8]}px)">${isNext?'<span class="bubble">START</span>':''}<span class="disc" lang="ja">${g}</span><span class="lbl">${esc(L.title)}</span></button>`}).join('')+'</div>';
    V.innerHTML=`<div class="vhead"><h1>Japanese</h1><button class="iconbtn" id="rtt" aria-label="Show or hide the sounds above Japanese" style="color:${SET.rt?'var(--red)':'var(--dim)'}"><ruby lang="ja" style="font:700 1.05rem var(--f-jp)">あ<rt style="color:inherit">a</rt></ruby></button></div>
      ${ml.length>1||true?chips:''}<div class="jtools">${[
        {id:'j-dc',ic:'book',t:'Dictionary',run:()=>openJDict()},
        {id:'j-tr',text:'文',t:'Translate',run:()=>openTranslate('to')},
        {id:'j-ck',ic:'pencil',t:'Check mine',run:()=>openTranslate('check')},
        {id:'j-nb',ic:'notebook',t:`Notebook${lists.japanese.length?' · '+lists.japanese.length:''}`,run:openNotebook},
        {id:'j-st',ic:'speech',t:'Starters',run:openStarters},
        {id:'j-kn',text:'あ',t:'Kana drill',run:openKana}
      ].map(o=>{ACT[o.id]=o.run;return`<button class="mini" data-act="${o.id}">${bi(o.ic,{text:o.text,ja:!!o.text,s:52})}<b>${esc(o.t)}</b></button>`}).join('')}</div>${units}<div class="spacer"></div>`;
    bindChips();$('#rtt').onclick=()=>{SET.rt=!SET.rt;saveSet();toast(SET.rt?'Sounds shown':'Sounds hidden');render()};
  }
}
const dayIndex=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
render();
if(!ONB)setTimeout(()=>openOnboarding(false),250);
if(KEY_FROM_LINK)setTimeout(()=>toast('You\'re set up. The tutor and translator are ready.'),600);

/* ================= offline (installed app) ================= */
if(IS_APP&&'serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
